id: no-anonymous-operations
message: the operation has no name
description: >-
  Reports an operation without a name (`{ a }`, `query { a }`).
why: >-
  Servers, logs, traces and caches identify an operation by its name. An anonymous one shows up as
  nothing in the query log, so it cannot be told from the others when something is slow or fails,
  and a persisted-query store has nothing to key it on.

  To fix, name the operation: `query GetA { a }`.
example: "query {   # reported\n  a\n}"
severity: off
category: suspicious
rule:
  kind: Operation
  regex: '^(query|mutation|subscription)?\s*[({@]'
report-on: first-token
