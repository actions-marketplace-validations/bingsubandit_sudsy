id: selection-set-depth
family: max
params: { count: depth, tag: selection-set }
message: "selection sets nest {count} levels deep; at most {max} are allowed"
description: >-
  Reports an operation or fragment that nests selection sets deeper than the `max` option allows.
  Fragments that are spread are not followed.
why: >-
  The cost of a query grows with its depth: each level can multiply the number of objects the server
  has to load. A depth limit is a cheap protection against queries that are expensive by accident or
  on purpose.

  To fix, flatten the query, or split it into several requests.
example: "{ a { b { c { d { e { f { g { h } } } } } } } }   # reported at the default depth"
severity: off
category: suspicious
options:
  - { name: max, type: int, default: 7, description: The deepest allowed nesting; the operation's own selection set is level 1. }
