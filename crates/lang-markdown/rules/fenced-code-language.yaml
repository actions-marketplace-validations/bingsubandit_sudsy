id: fenced-code-language
message: the fenced code block has no language
description: >-
  Reports a fenced code block that has no info string after the opening fence.
why: >-
  Renderers use the language to highlight the code, and tools use it to pick a formatter or to run a
  check on the block. Without it a block of JSON looks like any text, and tools skip it.

  To fix, name the language after the fence (```` ```json ````), or `text` when the block is not
  code.
example: 'a fence with no word after it'
severity: off
category: style
rule:
  kind: FencedCode
  regex: '\A(?:`{3,}|~{3,})[ \t]*(?:\n|\z)'
