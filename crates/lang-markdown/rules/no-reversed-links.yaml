id: no-reversed-links
message: the link syntax is reversed; write [text](url)
description: >-
  Reports link syntax written the wrong way round (`(text)[url]`), at the start of a paragraph or
  after whitespace, on the whole paragraph. No fix, because `(text)[url]` may be meant literally.
why: >-
  Markdown reads `[text](url)` as a link; with the brackets and parentheses swapped the text is
  shown as it is, with both pairs in it, and the link does not exist.

  To fix, swap them: `[text](url)`.
example: '(Docs)[https://example.com]   # [Docs](https://example.com)'
severity: warn
category: correctness
rule:
  kind: Inline
  regex: '(?:^|\s)\([^()\n]*\)\[[^\]\n]*\]'
