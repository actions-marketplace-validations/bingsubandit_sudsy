id: descriptive-link-text
message: the link text does not describe the destination
description: >-
  Reports a link whose text is `click here`, `here`, `link` or `more` (in any case) and nothing
  else.
why: >-
  Screen reader users often move from link to link and hear the texts without the text around them,
  and search engines read the text as a description of the target. `here` says neither where the
  link goes nor why, and the reader has to read the sentence to find out.

  To fix, write the text so that it names the destination: `[the install guide](...)`.
example: '[here](https://example.com/guide)   # [the guide](https://example.com/guide)'
severity: off
category: style
rule:
  kind: Link
  regex: '(?i)^\[(?:click here|here|link|more)\]'
