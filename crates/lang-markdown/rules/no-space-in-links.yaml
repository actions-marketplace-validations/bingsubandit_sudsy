id: no-space-in-links
message: the link text has spaces inside its brackets
description: >-
  Reports link text that starts or ends with a space (`[ docs ](url)`).
why: >-
  The spaces become part of the link, so the underlined, clickable text has blanks at its ends and
  the link looks off.

  To fix, move the spaces out of the brackets.
example: '[ docs ](url)   # [docs](url)'
severity: off
category: style
rule:
  kind: Link
  regex: '^\[(?:[ \t]+[^\]]|[^\]]*[^\]\s][ \t]+\])'
