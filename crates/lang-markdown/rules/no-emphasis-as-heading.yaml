id: no-emphasis-as-heading
message: emphasis is used instead of a heading
description: >-
  Reports a paragraph of one line that is only emphasized text (`**Overview**`) with no closing
  punctuation, outside a heading.
why: >-
  Bold text is not a heading to tools: it is missing from the outline, from the table of contents
  and from the navigation of a screen reader, and it cannot be linked to. A short bold line that
  works as a title belongs in a heading.

  To fix, use a heading (`## Overview`). Text that ends with punctuation (`**Note.**`) is a sentence
  and is not reported.
example: '**Overview**   # ## Overview'
severity: off
category: style
rule:
  kind: Inline
  regex: '^(\*\*[^*\n]*[^*\n.,;:!?。，；：！？]\*\*|__[^_\n]*[^_\n.,;:!?。，；：！？]__|\*[^*\n]*[^*\n.,;:!?。，；：！？]\*|_[^_\n]*[^_\n.,;:!?。，；：！？]_)$'
  not-inside:
    kind: Heading
