id: no-missing-space-atx
message: there is no space after the # of the heading
description: >-
  Reports a paragraph that starts with one to six `#` and no space after them (`#Heading`).
why: >-
  To a reader this is a heading, but CommonMark needs a space after the `#`, so it is plain text
  with a `#` in front. The heading is missing from the outline and from the table of contents.

  To fix, add a space: `# Heading`. A deliberate hash tag at the start of a line can be escaped with
  `\#`.
example: '#Heading   # # Heading'
severity: warn
category: correctness
rule:
  kind: Inline
  regex: '^#{1,6}[^#\s]'
  not-inside:
    kind: Heading
