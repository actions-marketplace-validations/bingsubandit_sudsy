[package]
name = "cli"
autotests = false
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "sudsy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
core-config.workspace = true
core-format.workspace = true
languages.workspace = true
lsp.workspace = true
core-incremental.workspace = true
core-rules.workspace = true
core-workspace.workspace = true
lang-csharp.workspace = true
core-syntax.workspace = true
provider-api.workspace = true
tempfile.workspace = true

[features]
default = ["static-grammars"]
static-grammars = ["languages/static-grammars", "lsp/static-grammars"]
pack-mode = ["languages/pack-mode", "lsp/pack-mode"]

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"

# `cargo binstall --git https://github.com/bingsubandit/sudsy sudsy` downloads the release archive of the
# platform (names: scripts/package-cli.sh) and installs the executable only; C# also needs the
# `csharp-worker/` directory of the archive (docs/ai/development/ci-release.md).
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-linux-x64.tar.gz"
bin-dir = "sudsy-{ version }-linux-x64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-linux-arm64.tar.gz"
bin-dir = "sudsy-{ version }-linux-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-darwin-x64.tar.gz"
bin-dir = "sudsy-{ version }-darwin-x64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-darwin-arm64.tar.gz"
bin-dir = "sudsy-{ version }-darwin-arm64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-win32-x64.zip"
bin-dir = "sudsy-{ version }-win32-x64/{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "https://github.com/bingsubandit/sudsy/releases/download/v{ version }/sudsy-{ version }-win32-arm64.zip"
bin-dir = "sudsy-{ version }-win32-arm64/{ bin }{ binary-ext }"
pkg-fmt = "zip"
