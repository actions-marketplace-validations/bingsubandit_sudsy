id: required-providers
family: module-names
params:
  block: Block
  body: Body
  head: type
  labels: labels
  members: ".tf"
  opaque: ".tf.json"
  merged: "override.tf"
  check: missing-provider
  use_heads: resource data
  name_heads: provider
  use_member: provider
  reference: VariableExpr
  separator: "_"
  provide_head: terraform
  provide_block: required_providers
  exempt: terraform
  entry_key: version
message: "Missing version constraint for provider `{name}` in `required_providers`"
description: >-
  A provider that a `resource`, `data` or `provider` block uses and that no `required_providers`
  entry of the module names, reported on the last such block of the provider, and a
  `required_providers` entry without a `version` (tflint terraform_required_providers). The
  built-in `terraform` provider is exempt; override files do not count.
example: 'resource "aws_instance" "a" {}'
severity: off
category: style
