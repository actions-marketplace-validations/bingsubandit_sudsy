id: unused-declarations
family: module-names
params:
  block: Block
  body: Body
  head: type
  labels: labels
  members: ".tf"
  opaque: ".tf.json"
  merged: "override.tf"
  check: unused
  declare_labels: variable data
  declare_members: locals
  declare_alias: provider
  alias_member: alias
  rename: variable=var locals=local
  reference: VariableExpr
  reference_member: GetAttr
  two_parts: data
message: "`{name}` is declared but not used"
description: >-
  A variable, local value, data source or provider alias that no file of the module (the `.tf`
  files of the directory) refers to (tflint terraform_unused_declarations). Override files declare
  nothing of their own; a module with `.tf.json` files, a file that does not parse or one that
  cannot be read is not judged.
example: 'variable "unused" {}'
severity: off
category: suspicious
