id: undefined-variable
family: scope
params: { check: undefined-variable }
message: "'{name}' is not defined."
description: A name that no scope declares, that is not a global of ES2026 (or, in a `.cjs` file, `require`, `module`, `exports` and `global`) and that is not in the `globals` option. `typeof x` and JSX tags are left alone.
example: "foo();   # reported"
severity: off
category: suspicious
options:
  - { name: globals, type: list, default: [], description: "Names the environment declares (ESLint's `languageOptions.globals`), such as `window` or `console`." }
---
id: no-const-assign
family: check
params: { check: const-assign }
message: "'{name}' is constant."
description: >-
  Reports a write to a `const` variable after its declaration: an assignment, `++` or `--`, or a
  destructuring target (`[c] = [1]`). The initializer is not a write.
why: >-
  Assigning to a `const` throws a `TypeError` when the line runs, so the program fails where the
  change was meant.

  To fix, declare the variable with `let`, or stop reassigning it.
example: "const a = 1; a = 2;   # the second a is reported"
severity: error
category: suspicious
---
id: no-class-assign
family: check
params: { check: class-assign }
message: "'{name}' is a class."
description: >-
  Reports an assignment to a class that is declared by name (`class K {} K = 1;`).
why: >-
  A class declaration creates a binding, and replacing it means the name stops standing for the
  class: later code that uses the name (`new K()`) gets something else, and the class is no longer
  reachable by that name.

  To fix, assign to another variable, or declare the class with `let K = class {}` where reassigning
  is intended.
example: "class A {} A = 0;   # the second A is reported"
severity: error
category: suspicious
---
id: no-func-assign
family: check
params: { check: func-assign }
message: "'{name}' is a function."
description: >-
  Reports an assignment to a function that is declared by name (`function f() {} f = 0;`), also
  `f++`.
why: >-
  A function declaration is hoisted, so calls above the assignment run the original and calls below
  run the new value. The name then means two things in one scope, and the declaration reads as the
  only definition.

  To fix, assign to another variable, or declare the function with `let f = function () {}` where
  reassigning is intended.
example: "function f() {} f = 0;   # the second f is reported"
category: suspicious
---
id: no-import-assign
family: check
params: { check: import-assign }
message: "'{name}' is read-only."
description: >-
  Reports a write to an imported name (`import a from 'a'; a = 1`, `bb = 2`), and a write to a
  member of a namespace import (`ns.x = 1`), a `delete ns.y` and `Object.assign(ns, {})`.
why: >-
  Imports are read-only live views of the exporting module. Assigning to one throws a `TypeError` in
  module code, and the namespace object of `import * as ns` cannot be changed either.

  To fix, keep the value in a local variable, or let the exporting module offer a function that
  changes it.
example: "import a from 'a'; a = 1;   # reported"
severity: error
category: suspicious
---
id: redeclared-variable
family: scope
params: { check: redeclared-variable }
message: "'{name}' is already defined."
description: A name declared again in the same scope (`var` twice, a `var` and a parameter, two functions). In TypeScript files declaration merging (interfaces, namespaces, a class with an interface) is allowed. Built-in globals are not checked.
example: "var a = 1; var a = 2;   # the second a is reported"
severity: off
category: suspicious
---
id: use-before-define
family: scope
params: { check: use-before-define }
message: "'{name}' was used before it was defined."
description: A reference that comes before the declaration of what it names in the source (function declarations included), or runs while the variable is being initialized. References in types are left alone.
example: "a(); function a() {}   # the first a is reported"
severity: off
category: suspicious
options:
  - { name: functions, type: bool, default: true, description: Check function declarations. }
  - { name: classes, type: bool, default: true, description: Check class declarations. }
  - { name: variables, type: bool, default: true, description: "Check `var`, `let` and `const` variables." }
---
id: shadowed-variable
family: scope
params: { check: shadowed-variable }
message: "'{name}' is already declared in the upper scope on line {line}."
description: A variable, parameter or function with the name of one declared in a scope around it. A function declared later in the outer scope still counts (it is hoisted), a variable declared later does not, and `var a = function a() {}` is not a shadow. In TypeScript files a type and a value of one name, and the parameters of function types, are left alone.
example: "var a = 1; function f() { var a = 2; }   # the inner a is reported"
severity: off
category: suspicious
options:
  - { name: allow, type: list, default: [], description: Names that may shadow. }
  - { name: kinds, type: list, choices: [variable, parameter, function, class, import, type], default: [], description: "The declarations that are checked for shadowing something (empty: all)." }
---
id: unused-variable
family: scope
params: { check: unused-variable }
message: "'{name}' is {action}."
description: "A variable, function, class, import or caught error that is never read. `a = a + 1` and `a++` as statements are no read, and exported names are used. In TypeScript files types, interfaces and enums count the same, and a name that only appears in `typeof` of a type is not read."
example: "const a = 1;   # reported"
severity: off
category: suspicious
options:
  - { name: caught_errors, type: string, choices: [all, none], default: all, description: "Whether the variable of a `catch` clause is checked." }
  - { name: ignore_pattern, type: regex, default: "", description: "A regex for the names that are not checked (ESLint's `varsIgnorePattern`)." }
  - { name: ignore_rest_siblings, type: bool, default: false, description: "Leave the names of an object pattern that has a rest element alone (`const { a, ...rest } = o`)." }
---
id: unused-parameter
family: scope
params: { check: unused-parameter }
message: "'{name}' is {action}."
description: "A parameter that is never read. By default only the parameters after the last one that is read are reported; the parameters of setters and signatures and the properties a constructor declares are used."
example: "function f(a, b) { return a; }   # b is reported"
severity: off
category: suspicious
options:
  - { name: args, type: string, choices: [after-used, all, none], default: after-used, description: "Which parameters are checked: those after the last one that is read, all of them, or none." }
  - { name: ignore_pattern, type: regex, default: "", description: "A regex for the names that are not checked (ESLint's `argsIgnorePattern`)." }
---
id: no-require-imports
family: check
params: { check: require-imports }
message: "A `require()` style import is forbidden."
description: >-
  Reports a call of the global `require(...)` and an `import x = require(...)`. A `require` that the
  file declares itself (a parameter, for example) is not reported.
why: >-
  `require` is the CommonJS loader and is not typed like an import: the result is `any` unless a
  type is added, and bundlers and the compiler cannot always follow it. An `import` is checked by
  the type system and understood by tools.

  To fix, use `import`.
example: "const a = require('a');   # reported"
severity: off
category: style
---
id: consistent-type-imports
family: check
params: { check: type-imports }
message: "Imports {name} are only used as type."
description: >-
  Reports an import in a TypeScript file whose names are all used only as types (also in `typeof` of
  a type) and is not written `import type`, a mixed import with such a name (the value names stay in
  an `import`), and the type form `import("a").B`. A name that is not used at all is not reported.
why: >-
  An import used only for types is erased when the file is compiled, but the compiler cannot always
  know that, so a plain `import` may stay as a real load with side effects, and a cycle between
  files can appear that the types did not need. `import type` states it, so the import is always
  removed.

  To fix, write `import type { T } from 'x'` or `import { type T } from 'x'`.
example: "import { T } from 't'; let a: T;   # the import is reported"
severity: off
category: style
---
id: prefer-const
family: check
params: { check: prefer-const }
message: "'{name}' is never reassigned. Use 'const' instead."
description: >-
  Reports a `let` variable that is assigned once and could be a `const`: the single write is its
  initializer, a `for-in` or `for-of` head, or the first assignment statement in the same block as
  the declaration. A variable written in a nested block or function, a `let` of a `for (;;)` head,
  and a destructuring that assigns members or outer names are not reported.
why: >-
  A `let` says the variable changes. When it never does, the keyword misleads the reader into
  looking for the later assignment, and `const` lets the compiler stop one.

  To fix, write `const`.
example: "let a = 1; f(a);   # reported"
severity: off
category: style
---
id: prefer-rest-params
family: check
params: { check: prefer-rest-params }
message: "Use the rest parameters instead of 'arguments'."
description: >-
  Reports `arguments` used in an ordinary function, except as the object of a member read by name
  (`arguments.length`). `arguments[0]` and passing `arguments` on are reported; an arrow function
  has no `arguments` of its own and is not checked.
why: >-
  `arguments` is an array-like object, not an array, and is tied to the function in ways that
  disable some optimizations, so `arguments.map(...)` fails. A rest parameter (`...args`) is a real
  array and shows in the parameter list.

  To fix, declare `...args`.
example: "function f() { g(arguments); }   # reported"
severity: off
category: style
---
id: no-unsafe-function-type
family: check
params: { check: unsafe-function-type }
message: "The `Function` type accepts any function-like value. Prefer explicitly defining any function parameters and return type."
description: >-
  Reports the global type `Function` used as a type, as an `interface ... extends` target and as an
  `implements` target. A class that `extends Function` (a value) is not reported.
why: >-
  `Function` accepts any callable value, and calling one takes any arguments and returns `any`, so
  the compiler no longer checks the call.

  To fix, write the signature (`(x: number) => string`), or `(...args: never[]) => unknown` for any
  function without losing the check.
example: "let f: Function;   # reported"
severity: off
category: suspicious
---
id: no-wrapper-object-types
family: check
params: { check: wrapper-object-types }
message: "Prefer using the primitive `{primitive}` as a type name, rather than the upper-cased `{name}`."
description: >-
  Reports the global types `BigInt`, `Boolean`, `Number`, `Object`, `String` and `Symbol` used as
  type names. The lower-case primitives are not reported.
why: >-
  `String` and the like are the types of the wrapper objects (`new String('a')`), not of the
  primitive values, and a primitive is assignable to them only by accident of the language. `Object`
  accepts every value except `null` and `undefined`, numbers and strings included.

  To fix, write `string`, `number`, `boolean`, `bigint` or `symbol`; for any non-primitive value
  write `object`.
example: "let s: String;   # reported"
severity: off
category: suspicious
