# PSScriptAnalyzer's rules that Sudsy has, at its severities (Error is error, Warning is warn).
powershell:
  lint:
    rules:
      no-cmdlet-aliases: warn
      no-print: warn
      no-eval: warn
      no-plain-text-secure-string: error
      no-wmi-cmdlets: warn
      no-plain-text-password: warn
      no-default-true-switch: warn
      no-empty-catch: warn
      approved-verbs: warn
      no-global-vars: warn
      no-automatic-variable-assignment: warn
      null-comparison-side: warn
      supports-should-process: warn
      singular-nouns: warn
      process-block-for-pipeline: warn
      missing-mandatory-parameter: warn
      unused-variable: warn
      unused-parameter: warn
