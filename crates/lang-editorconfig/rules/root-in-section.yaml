id: root-in-section
message: "`root` only counts before the first section; here it is ignored"
description: >-
  Reports a `root` property inside a section. `root` stops the search for parent `.editorconfig`
  files only as a pair before the first `[section]`; inside a section editors ignore it. No fix:
  moving it into the preamble is the author's call.
why: >-
  The author meant to stop the search at this file, but it does nothing, so settings of the parent
  directories keep applying, and the files are formatted differently from what the file says.

  To fix, put `root = true` above the first section.
example: "[*]\nroot = true   # reported: move it above the first section"
severity: warn
category: correctness
rule:
  kind: Pair
  parent: { kind: Section }
  regex: '(?i)^root[ \t]*='
