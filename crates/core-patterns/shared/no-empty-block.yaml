id: no-empty-block
message: the block is empty (put code or a comment in it)
description: >-
  Reports a block with no statement and no comment as the body of an `if`, `else`, loop, `try` or
  `finally` (`if (a) { }`, `for (;;) { }`). A comment inside counts as content. A bare `{ }` and a
  function body are not reported, and an empty `catch` is the rule `no-empty-catch`. With
  `comment_handles` off a comment does not count. With `waiting_loops` an empty loop whose condition
  is a call is a wait and is left alone, and so is a loop whose head matches `ignored_loop_heads`.
why: >-
  An empty block is usually a branch that was started and never filled in, or code that was deleted
  around it. The reader cannot tell whether the nothing is meant.

  To fix, write the code, or say in a comment that nothing is intended.
example: 'if (a) { }'
severity: warn
category: suspicious
options:
  - { name: comment_handles, type: bool, default: true, description: A comment in the block counts as content }
  - { name: waiting_loops, type: bool, default: false, description: Leave alone an empty loop whose condition is a call }
  - { name: ignored_loop_heads, type: regex, default: '\b\B', description: A regular expression for the condition or head of a loop whose empty body is left alone }
rule:
  role: block
  all:
    - any:
        - empty: true
        - all:
            - not: { option: comment_handles }
            - bare: true
    - any:
        - parent: { role: [conditional, loop, try] }
        - parent: { parent: { role: [conditional, loop, try] } }
  not:
    any:
      - parent: { role: catch }
      - all:
          - { option: waiting_loops }
          - parent: { role: loop, fields: { condition: { role: call } } }
      - parent: { role: loop, fields: { condition: { regex-option: ignored_loop_heads } } }
