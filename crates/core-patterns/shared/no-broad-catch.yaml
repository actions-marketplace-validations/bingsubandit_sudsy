id: no-broad-catch
per-language: true
message: 'the clause catches too much: name the exceptions it handles'
description: >-
  Reports a `catch`, `except` or `rescue` clause that catches everything (a clause with no type,
  when the `bare` option is set) or one of the broad `types`, when it does not raise the error again
  and has no call that matches `handled`. Each language lists the broad types in its grammar's
  `rule` row.
why: >-
  A broad clause also catches errors that the code did not expect, a typo that raises `NameError` or
  a user's interrupt, and turns them into a silent wrong result. The error is gone, and nobody
  learns that the program is broken.

  To fix, name the exceptions the code can handle, or raise the error again after the handling.
example: "try:\n    f()\nexcept:\n    g()"
severity: warn
category: suspicious
options:
  - { name: bare, type: bool, default: false, description: A clause with no type is broad }
  - { name: types, type: list, default: [], description: Types that are broad }
  - { name: handled, type: regex, default: '\b\B', description: A call that handles the error (logs its traceback) }
rule:
  role: catch
  any:
    - all:
        - { option: bare }
        - not: { fields: { type: { regex: '' } } }
    - all:
        - items:
            type:
              any:
                - in-option: types
                - has:
                    all:
                      - in-option: types
                      # `a.Exception` names another class; `::Exception` names this one.
                      - not: { parent: { role: member-access, fields: { object: { regex: '' } } } }
        - not: { rethrows: true }
        - not: { has: { role: call, regex-option: handled } }
