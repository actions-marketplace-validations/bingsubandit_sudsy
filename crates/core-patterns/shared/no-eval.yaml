id: no-eval
per-language: true
message: a string is run as code
description: >-
  Reports a call of one of the `calls` that run a string as code, on the call. Each language lists
  its calls in its grammar's `rule` row.
why: >-
  Code that is built from a string runs with all the rights of the program, so any part of the
  string that comes from outside is a way to run commands on the machine. It is also hard to read
  and not checked by the tools that analyse the program.

  To fix, use a parser for the data (`json.loads`), a lookup table, or a function.
example: 'exec("x = 1")'
severity: warn
category: suspicious
options:
  - { name: calls, type: list, default: [], description: Calls that run a string as code }
rule:
  role: call
  fields: { callee: { in-option: calls } }
