id: boolean-literal-comparison
message: 'comparing with a boolean literal is redundant: use the expression itself or `!`'
description: >-
  Reports an equality or inequality with a boolean literal on either side (`x == true`, `x !==
  false`, `true == x`, `x != False`). The option `literals` lists the texts that count as boolean
  literals, `not_operators` the operators that are not a comparison of value (Python `is`). Off by
  default.
why: >-
  Comparing a condition with `true` or `false` adds a token pair that says what the expression
  already says. `x == true` reads longer than `x`, and for values that are not strictly boolean (a
  number, a string) the comparison also means something other than the plain test.

  To fix, use the expression itself, or `!` before it.
example: 'if (done == true) {}'
severity: off
category: cleanup
options:
  - { name: literals, type: list, default: ['true', 'false', 'True', 'False'], description: The texts that are boolean literals }
  - { name: not_operators, type: list, default: [], description: Equality operators that are not a comparison of value (Python `is`) }
rule:
  role: binary
  operator: equality
  not: { fields: { operator: { in-option: not_operators } } }
  any:
    - fields: { left: { in-option: literals } }
    - fields: { right: { in-option: literals } }
