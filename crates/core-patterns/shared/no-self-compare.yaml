id: no-self-compare
message: a value is compared with itself
description: >-
  Reports an equality or comparison whose two sides are the same tokens (`x === x`, `x < x`). `x !=
  x` used as a test for NaN is reported too. Two calls (`f() === f()`) count as the same tokens and
  are reported.
why: >-
  For a value the result is the same every time (except for NaN), so the test is dead or a typing
  error: the author compared a variable with itself instead of with another one.

  To fix, compare with the right value; to test for NaN, use `isNaN` or the language's own check.
example: 'if (a === a) {}'
severity: warn
category: suspicious
rule:
  role: binary
  operator: [equality, comparison]
  same: [left, right]
