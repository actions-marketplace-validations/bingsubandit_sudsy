id: no-constant-condition
message: the condition is a constant
description: >-
  Reports the condition of an `if`, a ternary or a loop that is a literal (`if (true)`, `if (0)`, `x
  = true ? 1 : 2`, `while (false)`). The usual forms of an endless loop (`while (true)`, `while
  (1)`, `for (;true;)`, `do {} while (true)`) are left alone.
why: >-
  With a literal as the test one branch always runs and the other never does, so the test is either
  dead code or a switch that was left on while debugging.

  To fix, remove the test and keep the branch that runs, or put the real condition in.
example: 'if (true) { run(); }'
severity: warn
category: suspicious
report-on: field condition
rule:
  role: [conditional, loop]
  fields:
    condition: { inner: { role: literal } }
  not:
    all:
      - { role: loop }
      - fields: { condition: { inner: { regex: '^(?:true|True|TRUE|1)$' } } }
