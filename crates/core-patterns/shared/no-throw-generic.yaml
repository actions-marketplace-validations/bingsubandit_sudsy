id: no-throw-generic
per-language: true
message: raise a specific exception, not a generic one
description: >-
  Reports a `raise` or `throw` of one of the generic `types`, itself or a call of it. Each language
  lists the types in its grammar's `rule` row.
why: >-
  A caller cannot tell a generic exception from any other error, so it can only catch everything or
  nothing, and the generic type also catches errors from other code. A specific type lets a caller
  handle the case.

  To fix, raise a specific exception: a built-in one that fits (`ValueError`), or a class of your
  own.
example: 'raise Exception("x")'
severity: off
category: style
options:
  - { name: types, type: list, default: [], description: Generic exception types }
rule:
  role: throw
  fields:
    value:
      any:
        - { in-option: types }
        - role: call
          fields: { callee: { in-option: types } }
