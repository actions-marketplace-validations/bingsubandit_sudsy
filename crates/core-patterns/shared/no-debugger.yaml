id: no-debugger
per-language: true
message: a call that stops in a debugger was left in the code
description: >-
  Reports a statement or a call that stops the program in a debugger: a `debugger;` statement, a
  call of one of the `calls` of the language (Python `breakpoint()`, `pdb.set_trace()`), or an
  import matching the option `imports`. A language lists its calls in its grammar's `rule` row.
why: >-
  A debugger call left in the code stops the program for whoever runs it, and in production it hangs
  a request or a process. It is always a leftover.

  To fix, delete the statement.
example: 'debugger;'
severity: warn
category: suspicious
options:
  - { name: calls, type: list, default: [], description: Calls that start a debugger }
  - { name: imports, type: regex, default: '\b\B', description: An import of a debugger module }
rule:
  any:
    - role: call
      fields: { callee: { in-option: calls } }
    - { role: debugger }
    - { role: import, regex-option: imports }
