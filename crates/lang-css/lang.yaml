vscode-languages: [css, scss, less]
options:
  - line_width: 80
  - indent_size: 2
  - indent_style
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between statements and comments."]
  - single_quote:
      default: false
      doc: "Write strings with single quotes. A string that holds more of the chosen quote than of the other keeps the other."
presets: [stylelint-recommended, stylelint-standard]
generate:
  output: data/names.txt
  header: "Generated by `cargo xtask generate css <npm dir>` from {known-css-properties} (MIT) and {mdn-data} (CC0-1.0): lowercase names without vendor prefixes."
  strip_leading: "@:"
  cut_at: "("
  drop_prefix: "-"
  sections:
    - name: property
      from:
        - {file: known-css-properties/data/all.json, at: properties, except: {file: mdn-data/css/at-rules.json, in_each: descriptors}}
        - {file: mdn-data/css/properties.json}
    - {name: at-rule, from: [{file: mdn-data/css/at-rules.json}]}
    - {name: unit, from: [{file: mdn-data/css/units.json}]}
    - {name: function, from: [{file: mdn-data/css/functions.json}]}
    - {name: pseudo-class, from: [{file: mdn-data/css/selectors.json, prefix: ":", not_prefix: "::"}]}
    - {name: pseudo-element, from: [{file: mdn-data/css/selectors.json, prefix: "::"}]}
