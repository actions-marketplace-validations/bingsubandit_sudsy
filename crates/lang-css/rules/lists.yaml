description: >-
  Reports a function that is in the `list` option.
why: >-
  A project can forbid a function that its browsers do not support or that its design system
  replaces. The rule is a policy: with no `list` it reports nothing.
example: "a { width: calc(1px + 2px) }   # reported with list: [calc]"
severity: off
category: style
options:
