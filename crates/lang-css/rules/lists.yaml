id: property-allowed-list
family: names
params: { target: property, mode: allowed }
message: "the property `{name}` is not allowed"
description: >-
  Reports a property that is not in the `list` option (names, or `/regex/`). Custom properties are
  not reported, and an empty list allows everything.
why: >-
  A project can limit the properties its styles use, for example to a design system's set, so a
  one-off property fails in review rather than later in the browser. The rule is a policy: with no
  `list` it reports nothing.
example: "a { float: left }   # reported with list: [color]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed properties: names, or `/regex/`." }
---
id: property-disallowed-list
family: names
params: { target: property, mode: disallowed }
message: "the property `{name}` is not allowed"
description: >-
  Reports a property that is in the `list` option (names, or `/regex/`). Custom properties are not
  reported.
why: >-
  A project can forbid properties that its browsers or its design system do not support, or that
  cause layout trouble (`float` in a flex design). The rule is a policy: with no `list` it reports
  nothing.
example: "a { float: left }   # reported with list: [float]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed properties: names, or `/regex/`." }
