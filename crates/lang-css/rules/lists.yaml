id: selector-combinator-allowed-list
family: names
params: { target: combinator, mode: allowed }
message: "the combinator `{name}` is not allowed"
description: >-
  Reports a combinator (`>`, `+`, `~`, or a space for the descendant combinator) that is not in the
  `list` option. An empty list allows everything.
why: >-
  A project can limit which relations between elements its selectors may use, for example to keep
  selectors short and fast to match. The rule is a policy: with no `list` it reports nothing.
example: "a > b {}   # reported with list: [\" \"]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed combinators." }
---
id: selector-combinator-disallowed-list
family: names
params: { target: combinator, mode: disallowed }
message: "the combinator `{name}` is not allowed"
description: >-
  Reports a combinator (`>`, `+`, `~`, or a space for the descendant combinator) that is in the
  `list` option.
why: >-
  A project can forbid a combinator, for example the descendant combinator, which ties a rule to the
  depth of the markup. The rule is a policy: with no `list` it reports nothing.
example: "a > b {}   # reported with list: [\">\"]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed combinators." }
---
id: selector-attribute-name-disallowed-list
family: names
params: { target: attribute, mode: disallowed }
message: "the attribute `{name}` is not allowed in a selector"
description: >-
  Reports an attribute selector whose name is in the `list` option.
why: >-
  A project can forbid selecting on an attribute such as `style`, whose value is generated or
  changes without notice. The rule is a policy: with no `list` it reports nothing.
example: "a[style] {}   # reported with list: [style]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed attribute names: names, or `/regex/`." }
---
id: selector-disallowed-list
family: names
params: { target: selector, mode: disallowed }
message: "the selector `{name}` is not allowed"
description: >-
  Reports a rule whose selector list, with whitespace collapsed, is in the `list` option (selectors,
  or `/regex/`).
why: >-
  A project can forbid selectors that cause trouble, such as `*` or a bare element, which restyle
  everything. The rule is a policy: with no `list` it reports nothing.
example: "a b {}   # reported with list: [a b]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed selectors: text, or `/regex/`." }
---
id: selector-attribute-operator-allowed-list
family: names
params: { target: attribute-operator, mode: allowed }
message: "the attribute operator `{name}` is not allowed"
description: >-
  Reports an attribute selector operator that is not in the `list` option. An empty list allows
  everything.
why: >-
  A project can limit the attribute operators of its selectors to the ones it understands, since
  `~=`, `|=` and `*=` match in ways that are easy to misread. The rule is a policy: with no `list`
  it reports nothing.
example: "[a~=b] {}   # reported with list: [=]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed operators (`=`, `~=`, `|=`, `^=`, `$=`, `*=`)." }
---
id: selector-attribute-operator-disallowed-list
family: names
params: { target: attribute-operator, mode: disallowed }
message: "the attribute operator `{name}` is not allowed"
description: >-
  Reports an attribute selector operator that is in the `list` option.
why: >-
  A project can forbid an operator, such as `*=`, whose substring match is easy to misread or slow.
  The rule is a policy: with no `list` it reports nothing.
example: "[a~=b] {}   # reported with list: [~=]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed operators (`=`, `~=`, `|=`, `^=`, `$=`, `*=`)." }
