id: unit-allowed-list
family: names
params: { target: unit, mode: allowed }
message: "the unit `{name}` is not allowed"
description: >-
  Reports a unit (`%` included) that is not in the `list` option, in values and at-rule preludes. An
  empty list allows everything.
why: >-
  A project can fix the units its layout uses (`rem` and `%`, not `px`), so lengths scale the same
  way throughout. The rule is a policy: with no `list` it reports nothing.
example: "a { width: 1em }   # reported with list: [px]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed units: names, or `/regex/`." }
---
id: unit-disallowed-list
family: names
params: { target: unit, mode: disallowed }
message: "the unit `{name}` is not allowed"
description: >-
  Reports a unit (`%` included) that is in the `list` option, in values and at-rule preludes.
why: >-
  A project can forbid a unit that does not fit its design, for example `px` where text has to
  follow the user's font size. The rule is a policy: with no `list` it reports nothing.
example: "a { width: 1em }   # reported with list: [em]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed units: names, or `/regex/`." }
---
id: function-allowed-list
family: names
params: { target: function, mode: allowed }
message: "the function `{name}` is not allowed"
description: >-
  Reports a function that is not in the `list` option. An empty list allows everything.
why: >-
  A project can limit the functions its stylesheets call to the ones its browsers support or its
  design system allows. The rule is a policy: with no `list` it reports nothing.
example: "a { width: calc(1px + 2px) }   # reported with list: [var]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed functions: names, or `/regex/`." }
