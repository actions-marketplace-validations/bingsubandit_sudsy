message: "the media feature `{name}` is not allowed"
description: >-
  Reports a media feature that is not in the `list` option. An empty list allows everything.
why: >-
  A project can limit the media features of its queries to the ones its design uses. The rule is a
  policy: with no `list` it reports nothing.
example: "@media (min-width: 1px) {}   # reported with list: [width]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed media features: names, or `/regex/`." }
