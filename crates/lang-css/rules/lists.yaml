id: selector-pseudo-class-allowed-list
family: names
params: { target: pseudo-class, mode: allowed }
message: "the pseudo-class `:{name}` is not allowed"
description: >-
  Reports a pseudo-class that is not in the `list` option. An empty list allows everything.
why: >-
  A project can limit the pseudo-classes of its selectors, for example to the ones its browsers
  support. The rule is a policy: with no `list` it reports nothing.
example: "a:hover {}   # reported with list: [focus]"
severity: off
category: style
options:
