id: at-rule-allowed-list
family: names
params: { target: at-rule, mode: allowed }
message: "the at-rule `@{name}` is not allowed"
description: >-
  Reports an at-rule that is not in the `list` option (a vendor prefix is left out of the name). An
  empty list allows everything.
why: >-
  A project can limit the at-rules of its stylesheets, for example to keep `@import` out of a
  bundle. The rule is a policy: with no `list` it reports nothing.
example: "@import 'a.css';   # reported with list: [media]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The allowed at-rules, without `@`: names, or `/regex/`." }
---
id: at-rule-disallowed-list
family: names
params: { target: at-rule, mode: disallowed }
message: "the at-rule `@{name}` is not allowed"
description: >-
  Reports an at-rule that is in the `list` option (a vendor prefix is left out of the name).
why: >-
  A project can forbid an at-rule, such as `@import`, that costs a request per file or that its
  build does not support. The rule is a policy: with no `list` it reports nothing.
example: "@import 'a.css';   # reported with list: [import]"
severity: off
category: style
options:
  - { name: list, type: list, default: [], description: "The disallowed at-rules, without `@`: names, or `/regex/`." }
