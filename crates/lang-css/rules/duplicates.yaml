id: declaration-block-no-duplicate-properties
family: check
params: { check: duplicate-properties }
message: "the property `{name}` is declared again"
description: >-
  Reports a property declared twice in one block, on the earlier declaration (on the later one when
  only the earlier one is `!important`). `src` and custom properties are not reported. With
  `ignore_consecutive_different_values` a repeat right after the same property with another value is
  left alone.
why: >-
  The later declaration replaces the earlier one, so the earlier one does nothing. Most often it is
  a copy and paste mistake or a leftover of an edit, and the author reads the wrong value as the one
  in force.

  To fix, delete the declaration that is not meant to apply. A deliberate fallback for old browsers
  (`display: -webkit-box; display: flex`) can stay with `ignore_consecutive_different_values`.
example: "a { color: red; color: blue }   # the first color is reported"
severity: off
category: suspicious
options:
  - { name: ignore_consecutive_different_values, type: bool, default: false, description: "Leave a repeat right after the same property with another value alone (`display: -webkit-box; display: flex`)." }
---
id: declaration-block-no-duplicate-custom-properties
family: check
params: { check: duplicate-custom-properties }
message: "the custom property `{name}` is declared again"
description: >-
  Reports a custom property declared twice in one block (names are case sensitive), on the repeat.
why: >-
  The later declaration of a custom property wins and the earlier one is lost, so the value that a
  reader sees first is not the value `var()` returns. It is almost always a copy and paste mistake.

  To fix, delete one of the declarations or rename it.
example: "a { --x: 1; --x: 2 }   # the second --x is reported"
category: suspicious
---
id: no-duplicate-selectors
family: check
params: { check: duplicate-selectors }
message: "the selector `{name}` is already used"
description: >-
  Reports a selector list that is already used by an earlier rule in the same block or file; the
  order of the selectors in the list does not matter (`b, a` repeats `a, b`).
why: >-
  Rules with the same selector are one rule written twice. The declarations end up apart, so a later
  change to one of them is easy to make in the wrong place, and the cascade between the two is hard
  to follow.

  To fix, merge the declarations into the first rule.
example: "a {}\nb, a {}\na, b {}   # reported"
severity: off
category: suspicious
---
id: keyframe-block-no-duplicate-selectors
family: check
params: { check: duplicate-keyframe-selectors }
message: "the keyframe selector `{name}` is already used"
description: >-
  Reports a selector that is used twice in one `@keyframes` rule (`from` and `FROM` count as the
  same, names are compared in lowercase).
why: >-
  Keyframes with the same offset are merged by the browser in order, and the later declarations win
  for the same property. The animation then differs from what the first block says.

  To fix, merge the two blocks.
example: "@keyframes k { from {} FROM {} }   # reported"
category: suspicious
---
id: no-duplicate-at-import-rules
family: check
params: { check: duplicate-imports }
message: "the @import of `{name}` is repeated"
description: >-
  Reports an `@import` that repeats an earlier one in the same file (same url, same media list;
  `'a.css'` and `url(a.css)` are the same url).
why: >-
  The second import is wasted: the browser fetches the file once, and the stylesheet is still parsed
  twice in some engines. It also hides which of the two position in the cascade is meant.

  To fix, delete the repeat.
example: "@import 'a.css';\n@import url(a.css);   # reported"
severity: off
category: suspicious
---
id: no-invalid-position-at-import-rule
family: check
params: { check: import-position }
message: "@import must come before every other rule except @charset and @layer"
description: >-
  Reports an `@import` that comes after a rule that is not `@charset`, `@layer` or another
  `@import`.
why: >-
  CSS ignores an `@import` that is not at the top of the stylesheet, so the file it names is never
  loaded and the styles silently are missing. There is no error in the browser.

  To fix, move the `@import` above every rule, behind `@charset` and `@layer`.
example: "a {}\n@import 'a.css';   # reported"
category: correctness
---
id: declaration-block-no-shorthand-property-overrides
family: check
params: { check: shorthand-overrides }
message: "the shorthand overrides `{name}`, declared before it"
description: >-
  Reports a shorthand property declared after one of its longhands in the same block (`margin-top:
  1px; margin: 0`), on the longhand.
why: >-
  The shorthand sets every longhand it stands for, so it overwrites the earlier longhand. The
  longhand does nothing, and the author probably meant it to apply on top of the shorthand.

  To fix, put the longhand after the shorthand.
example: "a { margin-top: 1px; margin: 0 }   # reported"
category: suspicious
