id: custom-media-pattern
family: names
params: { target: custom-media, mode: pattern }
message: "the custom media query `--{name}` does not match the pattern"
description: >-
  Reports a `@custom-media` name, without its `--`, that does not match the `pattern` option (a
  regex). An empty pattern allows everything.
why: >-
  A naming convention for custom media queries keeps the breakpoints of a project predictable. The
  rule is a policy: with no `pattern` it reports nothing.
example: "@custom-media --fooBar (min-width: 1px);   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: "The regex a custom media name, without its `--`, must match." }
---
id: selector-type-case
family: names
params: { target: type, mode: lower }
message: "write the type selector `{name}` in lowercase"
description: >-
  Reports a type selector with capitals (`A {}`).
why: >-
  HTML element names are matched without regard to case, so `A` and `a` select the same elements and
  capitals only add spellings. Lowercase is the convention and the one the markup uses.

  To fix, write the selector in lowercase.
example: "A {}   # reported"
severity: off
category: style
