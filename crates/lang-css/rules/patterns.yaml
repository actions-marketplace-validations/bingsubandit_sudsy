id: custom-property-pattern
family: names
params: { target: custom-property, mode: pattern }
message: "the custom property `--{name}` does not match the pattern"
description: >-
  Reports a custom property whose name, without the `--`, does not match the `pattern` option (a
  regex), where it is declared, used in `var()` or named by `@property`. An empty pattern allows
  everything.
why: >-
  A naming convention for custom properties makes the variables of a design system predictable, so a
  name can be guessed and searched for. The rule is a policy: with no `pattern` it reports nothing.
example: "a { --fooBar: 1 }   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: "The regex a custom property name, without its `--`, must match." }
