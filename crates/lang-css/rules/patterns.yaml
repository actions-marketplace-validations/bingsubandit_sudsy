id: keyframes-name-pattern
family: names
params: { target: keyframes-name, mode: pattern }
message: "the keyframes name `{name}` does not match the pattern"
description: >-
  Reports a `@keyframes` name that does not match the `pattern` option (a regex). An empty pattern
  allows everything.
why: >-
  Animation names are global to the page, so a convention (a prefix, kebab case) keeps them
  predictable and lowers the risk of two animations having the same name. The rule is a policy: with
  no `pattern` it reports nothing.
example: "@keyframes fooBar {}   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: The regex a keyframes name must match. }
