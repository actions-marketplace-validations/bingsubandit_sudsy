id: selector-class-pattern
family: names
params: { target: class, mode: pattern }
message: "the class `.{name}` does not match the pattern"
description: >-
  Reports a class selector whose name does not match the `pattern` option (a regex). An empty
  pattern allows everything.
why: >-
  A naming convention for classes (kebab case, BEM) makes them predictable, so you can guess a class
  and search for it. The rule is a policy: with no `pattern` it reports nothing.
example: ".fooBar {}   # reported with pattern: ^[a-z-]+$"
severity: off
category: style
options:
  - { name: pattern, type: regex, default: "", description: The regex a class name must match. }
