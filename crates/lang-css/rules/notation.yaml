id: length-zero-no-unit
message: "a zero length needs no unit"
description: >-
  Reports a zero length written with a unit (`0px`). Dimensions that are not lengths (`0s`, `0deg`),
  and anything inside a function, are not reported.
why: >-
  Zero is the same in every length unit, so the unit says nothing and costs bytes. Inside `calc()`
  and the like the unit may be needed, so those are left alone, as are times and angles, where a
  unit is required.

  To fix, write `0`.
example: "a { margin: 0px }   # reported"
severity: off
category: style
rule: { kind: Value }
token:
  kind: [Dimension]
  regex: '^[+-]?(?:0+\.?0*|\.0+)(?i:em|ex|ch|rem|lh|rlh|vw|vh|vi|vb|vmin|vmax|cm|mm|q|in|pt|pc|px|cap|ic|cqw|cqh|cqi|cqb|cqmin|cqmax|svw|svh|lvw|lvh|dvw|dvh)$'
---
id: function-url-quotes
message: "quote the url"
description: >-
  Reports an unquoted `url(...)`.
why: >-
  An unquoted url has to escape spaces, parentheses and quotes, and a file name that has one of
  these breaks the declaration. A quoted url can hold any character, so the habit of quoting never
  breaks.

  To fix, wrap the argument in quotes.
example: "a { background: url(a.png) }   # reported"
severity: off
category: style
rule: { any: [{ kind: Value }, { kind: Prelude }] }
token: { kind: [Url] }
---
id: import-notation
message: "write the @import in the other notation (a string or url())"
description: >-
  Reports an `@import` written in the notation the `url` option does not ask for: by default a
  string, so `url(...)` is reported; with `url: true`, `url(...)`, so a string is reported.
why: >-
  One notation for imports keeps the file uniform and easy to search. The string form is shorter;
  the `url()` form is the one that the older tools and bundlers read.
example: "@import url(a.css);   # reported; with url: true, @import 'a.css'; is"
severity: off
category: style
options:
  - { name: url, type: bool, default: false, description: Ask for url() instead of a string. }
rule:
  kind: AtRule
  regex: '^@(?i:import)\b'
  any:
    - { not: { option: url }, regex: '^@(?i:import)\s*(?i:url)\(' }
    - { option: url, not: { regex: '^@(?i:import)\s*(?i:url)\(' } }
---
id: no-invalid-double-slash-comments
message: "`//` does not start a comment in CSS"
description: >-
  Reports a rule or declaration that starts with `//`.
why: >-
  CSS has no line comments. The browser reads `// note` as part of the next statement, so the
  selector or the property name is wrong and the rule or declaration is dropped. The comment seems
  to work and breaks the line below it.

  To fix, write the comment as `/* note */`. Sass and Less read `//` as a comment, so there it is
  not reported.
example: "// note\na { color: red }   # reported"
category: correctness
rule:
  any:
    - { kind: Rule, regex: '^//' }
    - { kind: Declaration, regex: '^//' }
---
id: selector-pseudo-element-colon-notation
message: "write the pseudo-element with two colons"
description: >-
  Reports `:before`, `:after`, `:first-line` or `:first-letter` written with one colon.
why: >-
  CSS3 separated pseudo-elements from pseudo-classes with two colons so the reader can tell them
  apart. The single colon is kept only for old browsers, and a file that mixes both is inconsistent.

  To fix, write `::before`.
example: "a:before {}   # reported"
severity: off
category: style
rule:
  kind: Prelude
  parent: { kind: Rule }
  regex: '(?:^|[^:]):(?i:before|after|first-line|first-letter)\b'
---
id: selector-attribute-quotes
message: "quote the attribute value"
description: >-
  Reports an attribute selector whose value is not quoted (`[a=b]`).
why: >-
  An unquoted value must be a valid identifier, so a value with a space, a digit at the start or a
  punctuation mark makes the selector invalid and the rule is dropped. Always quoting avoids the
  trap.

  To fix, wrap the value in quotes: `[a="b"]`.
example: "[a=b] {}   # reported"
severity: off
category: style
rule:
  kind: Group
  regex: '^\[\s*[^\]=\s]+\s*[~|^$*]?=\s*[^"''\s\]]'
  inside: { kind: Prelude, parent: { kind: Rule } }
---
id: color-no-invalid-hex
message: "the hex color `$0` is not valid"
description: >-
  Reports a hex color that does not have 3, 4, 6 or 8 digits (`#ab`).
why: >-
  CSS accepts only those lengths, so the declaration is invalid and the browser drops it, and the
  element is left with the inherited or default color.

  To fix, correct the number of digits.
example: "a { color: #ab }   # reported"
category: correctness
rule: { kind: Value, parent: { kind: Declaration, child: { kind: Property } } }
token: { kind: [Hash], deep: true, regex: '^#[0-9A-Za-z]+$', not-regex: '^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$' }
---
id: color-no-hex
message: "do not use the hex color `$0`"
description: >-
  Reports a hex color (`#fff`).
why: >-
  Some projects use named colors or functions only, so a color can be told by its name or channels,
  not by a code that has to be decoded. The rule is a policy for those; it is off by default.

  To fix, write the color as a name or with `rgb()`, `hsl()` or another function.
example: "a { color: #fff }   # reported"
severity: off
category: style
rule: { kind: Value }
token: { kind: [Hash], deep: true, regex: '^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$' }
