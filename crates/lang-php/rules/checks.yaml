id: unsafe-new-static
message: "`new static` can build a subclass with another constructor: make the class or its constructor final"
description: >-
  Reports `new static` in a class that is not final and has no final or abstract constructor of its
  own. A constructor or a final parent in another file cannot be seen; the
  `@phpstan-consistent-constructor` tag of the class itself is.
why: >-
  `new static` builds the class of the caller, so a subclass can be built with its own constructor
  with other parameters, and the call in the parent fails with a missing argument.

  To fix, make the class or the constructor final, or call `new self`.
example: "class A { function make() { return new static(); } }"
severity: off
category: suspicious
rule:
  kind: Instantiation
  regex: '^new\s+static(\s*\(|$)'
  inside:
    all:
      - any: [{ kind: Class }, { kind: Trait }]
      - not:
          any:
            - regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:abstract|readonly)\s+)*final\b'
            - doc: '@phpstan-consistent-constructor'
            - has:
                kind: Method
                regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:public|protected|private|static)\s+)*(?:final|abstract)\s+(?:(?:public|protected|private)\s+)*function\s+__construct\b'
report-on: first-token
---
id: no-inner-function
message: "A named function declared inside a function or method only exists after the outer one has run: declare it at the top level or use a closure"
description: >-
  Reports a `function name() {}` statement in the body of a function, method or closure.
why: >-
  The inner function is declared when the outer one runs, so it does not exist before the first
  call, and a second call of the outer function fails with an error that the function is already
  declared.

  To fix, declare the function at the top level, or use a closure.
example: "function a() { function b() {} }"
severity: off
category: suspicious
rule:
  kind: Function
  inside: { any: [{ kind: Function }, { kind: Method }, { kind: Closure }, { kind: ArrowFunction }] }
report-on: first-token
---
id: implicit-nullable-parameter
message: "The type is nullable only through the `null` default: write `?` before the type (deprecated in PHP 8.4)"
description: >-
  Reports a parameter with a type that does not allow `null` and a `null` default (`int $a = null`).
why: >-
  The parameter is nullable only through the default, which is deprecated since PHP 8.4 and a notice
  to code that runs there. The type says one thing and the default another.

  To fix, write the nullable type: `?int $a = null`.
example: "function f(int $a = null) {}"
severity: off
category: suspicious
rule:
  kind: FunctionLikeParameter
  regex: '(?is)^(?:#\[.*?\]\s*)*(?:(?:public|protected|private|readonly)\s+)*(?<TYPE>[^$=]*?[^$=\s&.])\s*(?:&\s*)?(?:\.\.\.\s*)?\$\w+\s*=\s*null$'
constraints:
  TYPE: { not-regex: '(?i)[?#]|\bnull\b|^mixed$|^(?:(?:public|protected|private|readonly)\s*)+$' }
---
id: no-unset-hookable-property
message: "`unset` of `$this->${NAME}`: a subclass may give the property a hook, which cannot be unset"
description: >-
  Reports `unset($this->name)` of a property the class declares when a subclass could give the
  property a hook (PHP 8.4): the class is not final and the property is not private, final, static
  or readonly.
why: >-
  A property with a hook cannot be unset, so the call fails with an error in the subclass that
  overrides the property, while it works in the class that wrote it.

  To fix, set the property to `null` instead, or make the class or the property final.
example: "class A { public $a; function f() { unset($this->a); } }"
severity: off
category: suspicious
rule:
  kind: PropertyAccess
  regex: '^\$this\s*->\s*(?<NAME>\w+)$'
  parent: { kind: Unset }
  inside:
    all:
      - any: [{ kind: Class }, { kind: Trait }]
      - not: { regex: '(?s)^(?:#\[.*?\]\s*)*(?:(?:abstract|readonly)\s+)*final\b' }
      - has:
          kind: PlainProperty
          regex: '[$]${NAME}\b'
          not: { regex: '(?s)^[^$]*\b(?:private|final|readonly|static)\b' }
