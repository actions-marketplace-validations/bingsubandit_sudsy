id: no-duplicate-pattern
family: unique-names
params: { container: document, item: item, name: "parts:all", reset: "!", related: first listed here }
message: "`{name}` is already listed"
description: >-
  Reports a pattern that appears twice with no opposite pattern (`!x` for `x`) between the two, on
  the second.
why: >-
  The second pattern changes nothing. It is a copy and paste leftover that makes the file longer,
  and a reader looks for what it adds.

  To fix, delete the second pattern.
example: "*.log\nbuild/\n*.log   # reported: already listed above"
severity: off
category: suspicious
