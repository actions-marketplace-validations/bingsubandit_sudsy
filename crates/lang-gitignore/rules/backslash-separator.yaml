id: backslash-separator
message: "`\\` escapes the next character, it is not a path separator; use `/`"
description: >-
  Reports a pattern with a backslash before a letter, digit, `_` or `-` (`build\out`), which is the
  pattern `buildout`. `\.` and `\#` are ordinary escapes and are not reported. No fix.
why: >-
  In a pattern file `\` escapes the next character, it does not separate paths as on Windows, so the
  pattern matches something other than the path the author wrote, and the files stay in version
  control or in the build context.

  To fix, write `/`.
example: "build\\out   # reported: write build/out"
severity: warn
category: correctness
rule: { kind: Entry }
token: { kind: [Pattern], needs: '\', regex: '^\\[A-Za-z0-9_-]' }
