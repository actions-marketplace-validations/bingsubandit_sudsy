id: kubernetes-unset-memory-requirements
message: "a container of the pod has no memory limit (`resources.limits.memory`)"
description: >-
  Reports a Kubernetes manifest (kinds as in `kubernetes-no-read-only-root-fs`) with a container or
  init container that has no `resources.limits.memory`. The report is on the `kind:` line of the
  manifest.
why: >-
  A container without a memory limit can use all the memory of the node, and the kernel then stops
  other pods to get it back.

  To fix, set `resources.limits.memory` to the most the container needs.
example: "kind: Deployment   # a container without resources.limits.memory"
severity: off
category: suspicious
rule:
  kind: BlockMapping
  top-level:
    apiVersion: '^(?:[a-z0-9][a-z0-9.-]*/)?v\d+(?:alpha|beta)?\d*$'
    kind: '^(?<KIND>Pod|Deployment|DaemonSet|StatefulSet|ReplicaSet|ReplicationController|Job|CronJob)$'
  has:
    key-path: '^spec(\.template\.spec|\.jobTemplate\.spec\.template\.spec)?\.(containers|initContainers)\[\d+\]$'
    not:
      has:
        role: key-value
        key-path: '\.resources\.limits$'
        fields: { key: { regex: '^memory$' } }
report-on: $KIND
