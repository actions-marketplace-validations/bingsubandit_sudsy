id: ansible-module-fqcn
message: call this builtin module by its full name, `ansible.builtin.<module>`
description: >-
  Reports a task of an Ansible tasks file, handlers file or playbook that calls a module of
  ansible-core by its short name (`copy:`, `set_fact:`): the key of the task is in the `modules`
  option. Plays and tasks inside `block`, `rescue` and `always` are read too. Names of modules from
  other collections are not checked. The rule runs on files named like Ansible's: `tasks/`,
  `handlers/`, `playbooks/`, `*playbook*.yml` and `molecule/<scenario>/`.
why: >-
  A short name resolves through the collections a play lists and the ones installed, so another
  collection can take over a name like `copy` or `file`, and the task then runs a different module
  without any error. The full name `ansible.builtin.copy` names one module.

  To fix, write the full name.
example: "- copy: src=a dest=b   # write ansible.builtin.copy"
severity: off
category: suspicious
options:
  - name: modules
    type: list
    description: "Modules reported when called by this name (ansible-core modules and the redirects that resolve to them)."
    default: [
      add_host, apt, apt_key, apt_repository, assemble, assert, async_status, blockinfile,
      command, copy, cron, deb822_repository, debconf, debug, dnf, dnf5, dpkg_selections,
      expect, fail, fetch, file, find, gather_facts, get_url, getent, git, group, group_by,
      hostname, import_playbook, import_role, import_tasks, include_role, include_tasks,
      include_vars, iptables, known_hosts, lineinfile, meta, mount_facts, package,
      package_facts, pause, ping, pip, raw, reboot, replace, rpm_key, script, service,
      service_facts, set_fact, set_stats, setup, shell, slurp, stat, subversion, systemd,
      systemd_service, sysvinit, tempfile, template, unarchive, uri, user,
      validate_argument_spec, wait_for, wait_for_connection, yum, yum_repository,
      ansible.builtin.yum
    ]
rule:
  kind: BlockMappingEntry
  path: '(^|/)(tasks|handlers)/|(^|/)playbooks/[^/]+$|(^|/)[^/]*playbook[^/]*\.ya?ml$|(^|/)molecule/[^/]+/[^/]+\.ya?ml$'
  fields: { key: { in-option: modules } }
  parent:
    kind: BlockMapping
    key-path: '(^|\.(tasks|pre_tasks|post_tasks|handlers|block|rescue|always))\[\d+\]$'
    not: { child: { kind: BlockMappingEntry, fields: { key: { regex: '^(hosts|import_playbook)$' } } } }
report-on: field key
