rule:
  kind: BlockMapping
  top-level:
    apiVersion: '^(?:[a-z0-9][a-z0-9.-]*/)?v\d+(?:alpha|beta)?\d*$'
    kind: '^(?<KIND>[A-Z].*)$'
  not:
    top-level-in-option: { keys: [apiVersion, kind], option: known }
report-on: $KIND
