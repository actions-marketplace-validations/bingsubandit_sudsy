# `known` is generated by `scripts/kubernetes_kinds.py` from the OpenAPI spec of Kubernetes and the
# schema folder kubeconform reads by default (`master-standalone`, one `apiVersion/Kind` per pair).
id: kubernetes-schema-missing
message: "the kind has no schema in the Kubernetes API (a custom resource, or a kind that was removed)"
description: >-
  Reports the `kind:` of a Kubernetes manifest (a document with an `apiVersion` of the form
  `[group/]vN[alpha|beta]N` and a capitalised `kind`) whose `apiVersion` and `kind` joined by `/`
  are not an item of the `known` option, the pairs of the Kubernetes API that kubeconform finds a
  schema for by default. Custom resources (Argo, Flux, Istio, Tekton, `CustomResourceDefinition`
  itself, `Kustomization`) are reported until their `apiVersion/Kind` is added to `known`.
why: >-
  A tool that validates manifests against the schemas of Kubernetes cannot check a kind it has no
  schema for, and an `apiVersion` or `kind` with a typo or a version that the cluster no longer
  serves (`extensions/v1beta1`) fails at `kubectl apply`.

  To fix, correct the `apiVersion` or `kind`, or add the pair of a custom resource to `known`.
example: "apiVersion: extensions/v1beta1   # no longer served: use networking.k8s.io/v1"
severity: off
category: correctness
