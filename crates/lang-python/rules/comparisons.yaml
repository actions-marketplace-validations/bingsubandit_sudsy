id: none-comparison
message: compare to None with `is` or `is not`, not `==` or `!=`
description: A comparison of a value to `None` with `==` or `!=`.
example: 'x == None'
severity: warn
category: suspicious
rule:
  any:
    - { pattern: '$A == None' }
    - { pattern: '$A != None' }
    - { pattern: 'None == $A' }
    - { pattern: 'None != $A' }
---
id: true-false-comparison
message: test the truth of the value instead of comparing it to True or False
description: A comparison of a value to `True` or `False` with `==` or `!=`.
example: 'x == True'
severity: off
category: style
rule:
  any:
    - { pattern: '$A == True' }
    - { pattern: '$A != True' }
    - { pattern: '$A == False' }
    - { pattern: '$A != False' }
    - { pattern: 'True == $A' }
    - { pattern: 'True != $A' }
    - { pattern: 'False == $A' }
    - { pattern: 'False != $A' }
---
id: not-in-test
message: use `not in`, not `not ... in`
description: A membership test negated in front of the expression (`not a in b`).
example: 'not a in b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A in $B' }
    - { pattern: 'not ($A in $B)' }
---
id: not-is-test
message: use `is not`, not `not ... is`
description: An identity test negated in front of the expression (`not a is b`).
example: 'not a is b'
severity: off
category: style
rule:
  any:
    - { pattern: 'not $A is $B' }
    - { pattern: 'not ($A is $B)' }
