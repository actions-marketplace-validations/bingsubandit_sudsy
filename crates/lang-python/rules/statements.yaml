id: bare-except
message: name the exceptions to catch; a bare `except` also catches `SystemExit` and `KeyboardInterrupt`
description: An `except` clause without an exception type, unless it raises again.
example: "try:\n    pass\nexcept:\n    pass"
severity: warn
category: suspicious
rule:
  kind: ExceptHandlerExceptHandler
  regex: '^except\s*:'
  not: { has: { kind: StmtRaise } }
report-on: first-token
---
id: lambda-assignment
message: define a function with `def` instead of assigning a lambda
description: A lambda assigned to a name.
example: 'f = lambda x: x'
severity: off
category: style
rule:
  any:
    - { kind: StmtAssign, regex: '^[A-Za-z_]\w*\s*=\s*lambda\b' }
    - { kind: StmtAnnAssign, regex: '^[A-Za-z_]\w*\s*:[^=]+=\s*lambda\b' }
---
id: multiple-imports-on-one-line
message: put each import on a line of its own
description: An `import` that names several modules.
example: 'import os, sys'
severity: off
category: style
rule:
  kind: StmtImport
  regex: '^import\s+[^,]+,'
---
id: f-string-missing-placeholders
message: this f-string has no placeholders; drop the `f`
description: An f-string with no replacement field in any of its parts.
example: 'f"text"'
severity: warn
category: suspicious
rule:
  kind: ExprFString
  not: { has: { kind: InterpolatedElement } }
---
id: assert-tuple
message: 'this assert is always true: its test is a non-empty tuple'
description: An `assert` whose test is a tuple (a message written inside the parentheses).
example: 'assert (x, "message")'
severity: warn
category: correctness
rule:
  pattern: 'assert ($A, $$$B)'
---
id: if-tuple
message: 'this condition is always true: it is a non-empty tuple'
description: An `if` or `elif` whose test is a tuple.
example: 'if (x, y):'
severity: warn
category: correctness
rule:
  any:
    - { kind: StmtIf, child: { kind: ExprTuple, regex: '^\(.*,' } }
    - { kind: ElifElseClause, child: { kind: ExprTuple, regex: '^\(.*,' } }
report-on: first-token
---
id: raise-not-implemented
message: raise `NotImplementedError`; `NotImplemented` is not an exception
description: A `raise` of `NotImplemented`.
example: 'raise NotImplemented'
severity: warn
category: correctness
rule:
  any:
    - { pattern: 'raise NotImplemented' }
    - { pattern: 'raise NotImplemented($$$ARGS)' }
---
id: return-outside-function
message: '`return` outside of a function'
description: A `return` that is not inside a function.
example: 'return 1'
severity: warn
category: correctness
rule:
  kind: StmtReturn
  not: { inside: { kind: StmtFunctionDef } }
report-on: first-token
