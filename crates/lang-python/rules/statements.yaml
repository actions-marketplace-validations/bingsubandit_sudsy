id: multiple-imports-on-one-line
message: put each import on a line of its own
description: An `import` that names several modules.
example: 'import os, sys'
severity: off
category: style
rule:
  kind: StmtImport
  regex: '^import\s+[^,]+,'
---
id: assert-tuple
message: 'this assert is always true: its test is a non-empty tuple'
description: An `assert` whose test is a tuple (a message written inside the parentheses).
example: 'assert (x, "message")'
severity: warn
category: correctness
rule:
  pattern: 'assert ($A, $$$B)'
---
id: if-tuple
message: 'this condition is always true: it is a non-empty tuple'
description: An `if` or `elif` whose test is a tuple.
example: 'if (x, y):'
severity: warn
category: correctness
rule:
  any:
    - { kind: StmtIf, child: { kind: ExprTuple, regex: '^\(.*,' } }
    - { kind: ElifElseClause, child: { kind: ExprTuple, regex: '^\(.*,' } }
report-on: first-token
---
id: raise-not-implemented
message: raise `NotImplementedError`; `NotImplemented` is not an exception
description: A `raise` of `NotImplemented`.
example: 'raise NotImplemented'
severity: warn
category: correctness
rule:
  any:
    - { pattern: 'raise NotImplemented' }
    - { pattern: 'raise NotImplemented($$$ARGS)' }
