id: rpc-request-standard-name
message: 'the type should be named `${RPC}Request` or `${SERVICE}${RPC}Request`'
description: >-
  Reports an rpc whose request type is not named `<Rpc>Request` or `<Service><Rpc>Request`.
why: >-
  A request type with the name of its rpc is not reused for another rpc. A shared type couples the
  two calls, and a change for one changes the other.

  To fix, give each rpc its own request message with that name.
example: 'service S { rpc Get(Foo) returns (GetResponse); }'
severity: off
category: style
rule:
  kind: MessageType
  nth: 1
  regex: '(?s)^(?<TYPE>.*)$'
  parent: { kind: Rpc, regex: '^rpc\s+(?<RPC>\w+)', parent: { kind: Service, regex: '^service\s+(?<SERVICE>\w+)' } }
constraints:
  TYPE: { not-regex: '(?:^|\.)(?:${SERVICE})?${RPC}Request$' }
---
id: rpc-response-standard-name
message: 'the type should be named `${RPC}Response` or `${SERVICE}${RPC}Response`'
description: >-
  Reports an rpc whose response type is not named `<Rpc>Response` or `<Service><Rpc>Response`.
why: >-
  A response type with the name of its rpc is not reused for another rpc. A shared type couples the
  two calls, and a change for one changes the other.

  To fix, give each rpc its own response message with that name.
example: 'service S { rpc Get(GetRequest) returns (Foo); }'
severity: off
category: style
rule:
  kind: MessageType
  nth: 2
  regex: '(?s)^(?<TYPE>.*)$'
  parent: { kind: Rpc, regex: '^rpc\s+(?<RPC>\w+)', parent: { kind: Service, regex: '^service\s+(?<SERVICE>\w+)' } }
constraints:
  TYPE: { not-regex: '(?:^|\.)(?:${SERVICE})?${RPC}Response$' }
---
id: rpc-request-response-unique
family: member-ref-unique
params: { message: '"{type}" is used as the request or response type for multiple RPCs' }
description: >-
  Reports an rpc whose request or response type is also the request or response type of another rpc
  of the project.
why: >-
  A message that several rpcs share couples them: adding a field for one call changes the others,
  and the calls cannot evolve apart.

  To fix, give each rpc its own request and response messages.
example: 'service S { rpc A(Foo) returns (Bar); rpc B(Foo) returns (Baz); }'
severity: off
category: style
