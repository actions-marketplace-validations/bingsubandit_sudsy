vscode-languages: [groovy]
grammar-crate: tree-sitter-groovy
grammar-path: grammars/tree-sitter-groovy
extensions: [gradle]
formatter: FORMAT
composite:
  text: Text
  continuation: true
format-rows:
  frame-indent: true
  trim-bracket-edges: true
  keep-comment-gap: true
options:
  - indent_size: 4
  - indent_style
  - final_newline: true
  - end_of_line
  - max_blank_lines: [1, "Largest number of blank lines kept between lines."]
mapping:
  same: 'closure closure_parameters block class_body enum_body switch_block argument_list list_literal map_literal map_entry named_argument command_chain parenthesized_expression formal_parameters binary_expression unary_expression ternary_expression elvis_expression range_expression spread_arguments switch_case'
  Document: source_file
  Comment: 'line_comment block_comment groovydoc_comment shebang'
  Ident: 'identifier type_identifier'
  Number: number_literal
  String: 'string_literal quoted_identifier'
  Keyword: 'boolean_literal null_literal abstract as assert break case catch class continue def default do else enum extends final finally for if implements import in instanceof interface native new non-sealed package permits pipeline private protected public return sealed static strictfp super switch synchronized throw throws trait transient try var volatile while yield !instanceof !in'
  Op: '! != !== % %= & && &= * ** **= *= + ++ += - -- -= /= < <= <=> << <<= == === ==> ==~ =~ > >= >> >>= >>> >>>= ?: ?= ^ ^= | |= || ~ .. ..< <.. <..< ... @ *: $/ /$ #!'
  Assign: '= += -= *= /= %= **= <<= >>= >>>= &= ^= |= ?= ||= &&='
  Dot: '. ?. ??. *. .& .@ ::'
  Open: '( [ { ?['
  Close: ') ] }'
