id: attr-pattern
family: names
params: { target: attr-name, mode: pattern }
message: "the attribute name `{name}` does not match the pattern"
description: >-
  Reports an attribute name that does not match the option `pattern`, a regex that by default allows
  letters, digits, `-` and `:` in either case. An underscore, for example, is reported (`data_x`).
why: >-
  A naming rule for attributes keeps custom data attributes and framework attributes uniform. A name
  outside the usual character set is most often a typing error that the browser silently accepts as
  a new attribute.

  To fix, rename the attribute, or change the pattern.
example: '<p a_b="c">   <p a-b="c">'
severity: off
category: style
options:
  - { name: pattern, type: regex, default: '(?i)^[a-z0-9:-]+$', description: The regex the value must match. }
