id: no-raw-gt
message: write `&gt;` for a `>` in text
description: >-
  Reports a `>` in text (`a > b`). A raw `<` in text is a syntax error.
why: >-
  A `>` is valid HTML and renders as written. Some tools and templates still treat a lone `>` as the
  end of a tag, so escaping it avoids surprises.

  To fix, write `&gt;`.
example: '<p>a > b</p>   <p>a &gt; b</p>'
severity: off
category: style
rule:
  kind: Chunk
  regex: '(?<C>>)'
  not-inside:
    any:
      - { kind: Element, regex: '(?i)^<(script|style|textarea|title)\b' }
      - kind: Interpolation
report-on: $C
