id: no-ambiguous-ampersand
message: write `&amp;` for a lone `&` and `&lt;` for a `<` in text
description: >-
  Reports an `&` in text that starts no character reference (`a & b`), and a raw `<` in text where
  it is not a syntax error, such as the Hugo shortcode `{{<`. A `>` is the rule `no-raw-gt`.
why: >-
  A lone `&` renders as written, but it turns into a different character the day the text after it
  spells an entity, and some tools reject it.

  To fix, write `&amp;` for the `&` and `&lt;` for the `<`.
example: '<p>a & b</p>   <p>a &amp; b</p>'
severity: off
category: style
rule:
  any:
    - { kind: Chunk, regex: '(?<C>&)(?:[^A-Za-z#]|$|#(?:[^0-9xX]|$))' }
    - { kind: Mustache, regex: '^\{\{(?<C><)' }
  not-inside:
    any:
      - { kind: Element, regex: '(?i)^<(script|style|textarea|title)\b' }
      - kind: Interpolation
report-on: $C
