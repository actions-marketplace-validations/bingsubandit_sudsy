id: require-sri
message: a script or stylesheet needs an `integrity` attribute
description: >-
  Reports a `<script src>` and a `<link rel="stylesheet" href>` with no `integrity` attribute.
why: >-
  A file loaded from a CDN or another server can change after the page was written, and the page
  then runs or applies the changed file without noticing.

  To fix, add `integrity` with the hash of the file and `crossorigin="anonymous"`.
example: '<script src="a.js"></script>   <script src="a.js" integrity="sha384-..." crossorigin="anonymous"></script>'
severity: off
category: suspicious
rule:
  kind: StartTag
  not-has: { kind: Attribute, regex: '(?i)^integrity\b' }
  any:
    - regex: '(?i)^<script\b'
      has: { kind: Attribute, regex: '(?i)^src\b' }
    - regex: '(?i)^<link\b'
      has: { kind: Attribute, regex: '(?is)^rel\s*=\s*["'']?\s*stylesheet\b' }
report-on: first-token
