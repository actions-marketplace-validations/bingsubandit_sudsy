id: img-alt
message: <img> needs an `alt` attribute
description: >-
  Reports an `<img>` with no `alt` attribute (WCAG H37). An image hidden from assistive technology
  (`aria-hidden="true"`, `role="presentation"` or `none`) is not reported, and neither is an empty
  `alt=""`.
why: >-
  With no `alt` a screen reader reads the file name, and a browser that does not load the image
  shows nothing. An `alt` is also what search engines index for the image.

  To fix, add an `alt` that says what the image shows, or `alt=""` if it is only decoration.
example: '<img src="a.png">   <img src="a.png" alt="A cat">'
severity: off
category: correctness
rule:
  kind: StartTag
  regex: '(?i)^<img\b'
  not-has:
    any:
      - { kind: Attribute, regex: '(?is)^alt\b' }
      - { kind: Attribute, regex: '(?is)^aria-hidden\s*=\s*["'']?true\b' }
      - { kind: Attribute, regex: '(?is)^role\s*=\s*["'']?(presentation|none)\b' }
