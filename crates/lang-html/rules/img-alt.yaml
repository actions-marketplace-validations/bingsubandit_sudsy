id: img-alt
message: <img> needs an `alt` attribute
description: >-
  An `<img>` with no `alt` has no text alternative (WCAG H37; html-validate wcag/h37). One hidden
  from assistive technology (`aria-hidden="true"`, `role="presentation"` or `none`) is left alone.
example: '<img src="a.png">   <img src="a.png" alt="A cat">'
severity: off
category: correctness
rule:
  kind: StartTag
  regex: '(?i)^<img\b'
  not-has:
    any:
      - { kind: Attribute, regex: '(?is)^alt\b' }
      - { kind: Attribute, regex: '(?is)^aria-hidden\s*=\s*["'']?true\b' }
      - { kind: Attribute, regex: '(?is)^role\s*=\s*["'']?(presentation|none)\b' }
