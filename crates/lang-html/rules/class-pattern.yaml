id: class-pattern
family: names
params: { target: class, mode: pattern }
message: "the class `{name}` is not kebab-case"
description: >-
  Reports a class name that does not match the option `pattern`, a regex that by default means
  kebab-case (`foo-bar`). Each class of a `class` attribute is checked on its own.
why: >-
  Class names are looked up by name in stylesheets and scripts; one naming style makes them
  predictable to write and to search for. A class in another style is often a typo that no
  stylesheet ever matches.

  To fix, rename the class here and in the stylesheet, or change the pattern.
example: '<p class="fooBar">   <p class="foo-bar">'
severity: off
category: style
options:
  - { name: pattern, type: regex, default: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$', description: The regex the value must match. }
