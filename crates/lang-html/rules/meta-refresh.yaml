id: meta-refresh
message: a refresh with a delay takes control away from the user; redirect on the server or with a 0 delay
description: >-
  Reports `<meta http-equiv="refresh">` with a delay (`content="5"`). A delay of 0 is not reported.
why: >-
  A page that reloads or redirects by itself after a time takes the control from the user,
  disorients screen reader users and cannot be paused.

  To fix, redirect on the server, or use a 0 delay; for a reload, give the user a button.
example: '<meta http-equiv="refresh" content="5">   <meta http-equiv="refresh" content="0; url=/new">'
severity: off
category: correctness
rule:
  kind: StartTag
  regex: '(?i)^<meta\b'
  all:
    - has: { kind: Attribute, regex: '(?is)^http-equiv\s*=\s*["'']?\s*refresh\b' }
    - has: { kind: Attribute, regex: '(?is)^content\s*=\s*["'']?\s*[1-9]' }
report-on: first-token
