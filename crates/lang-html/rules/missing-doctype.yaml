id: missing-doctype
message: the document has no doctype
description: A document without a doctype is rendered in quirks mode. Not in `.vue`, `.svelte` and `*.component.html` files, which are fragments of a page.
example: '<html>...</html>   <!DOCTYPE html><html>...</html>'
severity: off
category: correctness
rule:
  kind: Document
  not-has: { kind: Doctype }
  not: { path: '\.(vue|svelte)$|\.component\.html$' }
report-on: start
