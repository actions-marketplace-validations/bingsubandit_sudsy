id: use-baseline
family: meta
params: { check: unsupported-feature, owned: 'is,slot', owned-in: 'vue,svelte,component.html' }
message: "{feature} is not a {available} available baseline feature"
description: >-
  An element, attribute or attribute value that not all major browsers support (`<geolocation>`, `popover="hint"`, `rel="manifest"` on `<link>`), by the baseline data of web-features. A name the data does not list is not reported; custom elements are skipped, and so are `is` and `slot` in Vue, Svelte and Angular templates, where the framework owns them.
example: '<button interestfor="x">   <button>'
category: suspicious
severity: off
options:
  - { name: available, type: string, default: widely, description: "How widely a feature must be available: `widely` (in all major browsers for 30 months), `newly` (in all of them), or a year (baseline since that year or before)." }
