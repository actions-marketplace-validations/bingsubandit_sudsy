id: aria-label-misuse
message: "`aria-label` cannot name this element"
description: >-
  Reports an `aria-label` on an element that cannot be named by it: a generic element (`<div>`,
  `<span>`, `<p>`, `<b>`, ...) with no role, and an `<a>` without `href`. Interactive elements,
  landmarks and elements with a `role` are not reported.
why: >-
  Assistive technology ignores a label on an element that has no role, so the text is never read,
  and the author believes the element is described when it is not.

  To fix, give the element a role (or use a native element that has one), or move the text into the
  content.
example: '<div aria-label="x">   <div role="group" aria-label="x">'
severity: off
category: correctness
rule:
  kind: Attribute
  regex: '(?i)^aria-label(ledby)?\b'
  parent:
    kind: StartTag
    not-has: { kind: Attribute, regex: '(?i)^role\b' }
    any:
      - regex: '(?i)^<(div|span|p|b|i|u|s|em|strong|small|mark|code|kbd|samp|var|sub|sup|cite|q|dfn|abbr|time|data|bdi|bdo)\b'
      - regex: '(?i)^<a\b'
        not-has: { kind: Attribute, regex: '(?i)^href\b' }
