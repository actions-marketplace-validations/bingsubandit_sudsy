id: v-slot-style
family: template
params: { check: shorthand, from: "v-slot:", to: "#" }
message: "write `v-slot:` as `#`"
description: >-
  Reports `v-slot:` where the shorthand `#` would do (`v-slot:head`). The fix writes `#`.
