id: v-bind-style
family: template
params: { check: shorthand, from: "v-bind:", to: ":" }
message: "write `v-bind:` as `:`"
description: >-
  Reports `v-bind:` where the shorthand `:` would do (`v-bind:href`). The fix writes `:`.
why: >-
  One form keeps the templates uniform and shorter; the long form reads as a different thing from
  the short one though they mean the same.

  To fix, write `:`; the fix does it.
example: "<a v-bind:href=\"u\">   <a :href=\"u\">"
severity: warn
category: style
fix-kind: safe
---
id: v-on-style
family: template
params: { check: shorthand, from: "v-on:", to: "@" }
message: "write `v-on:` as `@`"
description: >-
  Reports `v-on:` where the shorthand `@` would do (`v-on:click`). The fix writes `@`.
why: >-
  One form keeps the templates uniform and shorter.

  To fix, write `@`; the fix does it.
example: "<b v-on:click=\"go\">   <b @click=\"go\">"
severity: warn
category: style
fix-kind: safe
