---
id: attribute-hyphenation
family: template
params: { check: hyphenation, only: vue }
message: "write the prop of a component in kebab-case (my-prop, not myProp)"
description: >-
  Reports a prop of a component that is written in camelCase (`:cardTitle`). A component is a tag in
  PascalCase or with a hyphen; HTML and SVG elements are not checked. Only in `.vue` files.
why: >-
  In a template the HTML parser lowercases attribute names, so only kebab-case reads the same in
  every kind of template, and one style keeps the props easy to search for.

  To fix, write the prop in kebab-case (`:card-title`).
example: "<MyCard :cardTitle=\"t\">   <MyCard :card-title=\"t\">"
severity: warn
category: style
---
id: v-on-event-hyphenation
family: template
params: { check: hyphenation, on: true, only: vue }
message: "write the event of a component in kebab-case (my-event, not myEvent)"
description: >-
  Reports an event of a component that is written in camelCase (`@cardOpen`). A component is a tag
  in PascalCase or with a hyphen; HTML and SVG elements are not checked. Only in `.vue` files.
why: >-
  Event names in a template are read in lowercase by the HTML parser, so kebab-case is the one form
  that works in every kind of template, and the component emits it in the same style.

  To fix, write the event in kebab-case (`@card-open`).
example: "<MyCard @cardOpen=\"go\">   <MyCard @card-open=\"go\">"
severity: warn
category: style
---
id: html-self-closing
family: template
params: { check: self-closing, only: vue }
message: "write an empty element as `<div />` and a void element as `<img>`"
description: >-
  Reports an element written in the wrong form for Vue's style: an HTML element, a component, an SVG
  or MathML element without content should be self-closed (`<div />`), a void HTML element should
  not (`<img>`). The elements of the file's root (`<template>`, `<script>`) are not reported. Only
  in `.vue` files.
why: >-
  Both forms mean the same in a Vue template, and the style puts the empty elements in one shape
  that is quick to see.

  To fix, write the empty element as `<div />` and the void one as `<img>`.
example: "<template><div></div><img /></template>   <template><div /><img></template>"
severity: off
category: style
---
id: attributes-order
family: template
params: { check: attributes-order, only: vue }
message: "put this attribute earlier: the order is: is, v-for, conditions, v-pre and v-once, id, ref, key and slots, v-model, other directives, attributes, events, v-html and v-text"
description: >-
  Reports an attribute that is out of the recommended order: `is`, `v-for`, conditions (`v-if`,
  `v-else-if`, `v-else`, `v-show`), `v-pre` and `v-once`, `id`, `ref`, `key` and slots, `v-model`,
  other directives, plain and bound attributes, events, and `v-html` and `v-text` last. A bare
  `v-bind="object"` takes the place of the attribute it precedes. The order is not alphabetical.
  Only in `.vue` files.
why: >-
  A fixed order puts the directives that decide whether and how often an element exists first, so a
  reader sees at once what the element is before they read how it looks.

  To fix, move the attribute to its place in the order.
example: "<a @click=\"go\" :href=\"u\" v-if=\"ok\">   <a v-if=\"ok\" :href=\"u\" @click=\"go\">"
severity: off
category: style
