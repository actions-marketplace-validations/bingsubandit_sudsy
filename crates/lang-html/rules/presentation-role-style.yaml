id: presentation-role-style
message: write `role="none"` instead of `role="presentation"`
description: >-
  Reports `role="presentation"`.
why: >-
  `none` and `presentation` mean the same, and ARIA 1.2 prefers `none`. Using one name keeps the
  files uniform.

  To fix, write `role="none"`.
example: '<p role="presentation">   <p role="none">'
severity: off
category: style
rule:
  kind: Attribute
  regex: '(?is)^role\s*=\s*["'']?\s*presentation\s*["'']?$'
