id: valid-id
message: an `id` begins with a letter and holds letters, digits, `-` and `_`
description: >-
  Reports an `id` that is empty, has white space, begins with a digit or has characters other than
  letters, digits, `-` and `_`.
why: >-
  Such an id is valid HTML5, but it must be escaped in CSS selectors (`#1a` does not select it) and
  some scripts and older tools fail on it.

  To fix, rename the id.
example: '<p id="1a">   <p id="a1">'
severity: off
category: suspicious
rule:
  kind: Attribute
  regex: '(?is)^id\s*='
  not: { regex: '(?is)^id\s*=\s*["'']?[A-Za-z][A-Za-z0-9_-]*["'']?$' }
