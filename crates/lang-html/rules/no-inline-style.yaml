id: no-inline-style
message: use a class and a stylesheet instead of a `style` attribute
description: >-
  Reports a `style` attribute, and a Svelte `style:property` directive. A `style` that sets only
  `display` is not reported, because scripts toggle it.
why: >-
  Styles in attributes cannot be shared between elements and pages, outweigh every rule of a
  stylesheet, and are blocked by a strict content security policy.

  To fix, use a class and a stylesheet.
example: '<p style="color: red">   <p class="red">'
severity: off
category: style
rule:
  kind: Attribute
  regex: '(?is)^style(\s*=|:)'
  not: { regex: '(?is)^style\s*=\s*["'']?\s*display\s*:[^;"'']*;?\s*["'']?$' }
