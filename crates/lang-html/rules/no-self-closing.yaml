id: no-self-closing
message: "`<$NAME>` must not be self-closed; write the end tag"
description: >-
  Reports an element that is self-closed with `/>` and is not a void element (`<div />`). Void
  elements (see `void-style`), `<svg>` and `<math>` are not reported.
why: >-
  In HTML `<div />` is a start tag: the browser ignores the slash and the element stays open and
  swallows what follows, so the page differs from what the markup seems to say.

  To fix, write the end tag (`<div></div>`).
example: '<div />   <div></div>'
severity: off
category: correctness
rule:
  kind: StartTag
  regex: '^<(?<NAME>[^\s/>]+).*/>$'
  not: { regex: '(?i)^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr|svg|math)\b' }
