id: no-use-v-if-with-v-for
message: "`v-if` and `v-for` on one element: `v-if` is evaluated first in Vue 3 and cannot read the loop variable"
description: >-
  Reports an element that has `v-if` and `v-for` together.
why: >-
  In Vue 3 `v-if` is evaluated first, so a condition on the loop variable fails with an error, and
  in Vue 2 the order was the other way round, which makes the code unsafe to port.

  To fix, filter the list in a computed value, or move the `v-if` to a wrapping `<template>`.
example: '<li v-for="x in xs" v-if="x.on">   <template v-for="x in xs"><li v-if="x.on">'
severity: warn
category: suspicious
rule:
  kind: StartTag
  all:
    - has: { kind: Attribute, regex: '^v-for[\s=]' }
    - has: { kind: Attribute, regex: '^v-if[\s=]' }
