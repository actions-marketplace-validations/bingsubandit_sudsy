id: v-for-key
family: template
params: { check: for-key }
message: a `v-for` needs a `:key`, so that Vue can reuse the elements when the list changes
description: >-
  Reports a `v-for` with no `:key` (or `v-bind:key`). On a `<template>` or `<slot>` the key goes on
  the child elements; components are left to `valid-v-for`.
why: >-
  Without a key Vue patches the elements in place when the list changes, which keeps stale state in
  inputs and components and breaks transitions.

  To fix, add a `:key` with a value that is unique to each item.
example: '<li v-for="x in xs">   <li v-for="x in xs" :key="x.id">'
severity: warn
category: correctness
