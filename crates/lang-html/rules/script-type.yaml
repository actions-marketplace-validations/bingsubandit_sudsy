id: script-type
message: the `type` attribute is unnecessary for JavaScript
description: >-
  Reports a `<script>` whose `type` is a JavaScript MIME type (`text/javascript`,
  `application/javascript`, ...) or empty. `type="module"` and other types are not reported.
why: >-
  The browser assumes that type, so the attribute says nothing and is only more text.

  To fix, remove the `type`.
example: '<script type="text/javascript"></script>   <script></script>'
severity: off
category: style
rule:
  kind: Attribute
  regex: '(?is)^type\s*=\s*["'']?\s*((application|text)/(x-)?(java|ecma|j|live)script(1\.[0-5])?|text/ecmascript)?\s*["'']?$'
  parent: { kind: StartTag, regex: '(?i)^<script\b' }
