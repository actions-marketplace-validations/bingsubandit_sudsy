id: attr-case
message: attribute names are lowercase
description: >-
  Reports an attribute name that is not in lowercase (`CLASS="a"`). Everything inside `<svg>` and
  `<math>` keeps its case and is not reported.
why: >-
  HTML reads attribute names without regard to case, so the capitals change nothing for the browser.
  They only make one file spell the same name two ways, which breaks searches and makes the markup
  look inconsistent.

  To fix, write the name in lowercase.
example: '<p CLASS="a">   <p class="a">'
severity: off
category: style
rule:
  kind: Attribute
  not-inside: { kind: Element, regex: '(?i)^<(svg|math)\b' }
token: { kind: [AttrName], regex: '[A-Z]' }
