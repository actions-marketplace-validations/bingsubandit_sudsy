id: require-each-key
message: an `{#each}` block needs a key, `(item.id)`, so that Svelte reuses the elements when the list changes
description: >-
  Reports an `{#each}` block with no key (`{#each items as item}`).
why: >-
  Without a key the block updates the elements in place when the list changes, which keeps stale
  state in inputs and components and breaks transitions.

  To fix, add a key, `{#each items as item (item.id)}`.
example: '{#each items as item}   {#each items as item (item.id)}'
severity: warn
category: correctness
rule:
  kind: BlockTag
  regex: '^\{#each\b'
  not: { regex: '\)\s*\}$' }
