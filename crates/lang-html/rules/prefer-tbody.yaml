id: prefer-tbody
message: put the rows of a <table> in a <tbody>
description: >-
  Reports a `<tr>` that is directly in a `<table>`.
why: >-
  The browser puts it into an implied `<tbody>`, so the DOM differs from the markup, and a selector
  such as `table > tr` never matches.

  To fix, write the `<tbody>`.
example: '<table><tr><td>a</td></tr></table>   <table><tbody><tr><td>a</td></tr></tbody></table>'
severity: off
category: style
rule:
  kind: Element
  regex: '(?i)^<tr\b'
  parent: { kind: Element, regex: '(?i)^<table\b' }
report-on: first-token
