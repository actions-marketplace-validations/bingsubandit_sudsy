id: attr-spacing
message: separate attributes with whitespace
description: >-
  Reports a quoted attribute value that is directly followed by the next attribute, with no white
  space between them (`class="a"id="b"`).
why: >-
  Parsers accept it with an error, and many tools read it differently. Two attributes stuck together
  are hard to read and are usually a missing space from an edit.

  To fix, put a space between the attributes.
example: '<a href="x"class="y">   <a href="x" class="y">'
severity: off
category: style
rule:
  kind: StartTag
  regex: '=\s*(?:"[^"]*"|''[^'']*'')[^\s/>]'
