id: attr-quotes
message: quote attribute values with double quotes, unless the value holds one
description: >-
  Reports an attribute value that is not quoted with `"`: a value with no quotes (`class=a`), and a
  value in `'` unless it holds a `"` (`class='a'`). In Svelte, `name={expression}` is not reported,
  because the braces are the syntax.
why: >-
  An unquoted value ends at the first space or `>`, so a later edit that adds a word to the value
  changes the markup. One quote style keeps the files uniform and the diffs small.

  To fix, quote the value with `"`.
example: "<p id=a title='b'>   <p id=\"a\" title=\"b\">"
severity: off
category: style
rule:
  kind: Attribute
  regex: '^[^\s=]+\s*=\s*(?:[^"''\s]|''[^"]*''$)'
  not: { path: '\.svelte$', regex: '^[^\s=]+\s*=\s*\{' }
