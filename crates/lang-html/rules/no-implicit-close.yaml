id: no-implicit-close
message: write the end tag of `<$NAME>`
description: >-
  Reports an element whose end tag is left out and that the next sibling or the end tag of its
  parent closes (`<li>`, `<p>`, ...). Void and self-closed elements have no end tag and are not
  reported.
why: >-
  The rules for the implied end are complex: a `<p>` ends when a `<div>` begins, a `<li>` when the
  next `<li>` begins. A reader and a tool cannot always tell where an element ends, and an edit can
  change it.

  To fix, write the end tag.
example: '<ul><li>a<li>b</ul>   <ul><li>a</li><li>b</li></ul>'
severity: off
category: style
rule:
  kind: Element
  regex: '^<(?<NAME>[^\s/>]+)'
  not-has: { kind: EndTag }
  not:
    any:
      - regex: '(?i)^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b'
      - child: { kind: StartTag, regex: '/>$' }
report-on: first-token
