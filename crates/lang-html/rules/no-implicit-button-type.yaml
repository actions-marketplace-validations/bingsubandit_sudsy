id: no-implicit-button-type
message: a <button> needs a `type`; a button without one submits its form
description: >-
  Reports a `<button>` with no `type`. A Svelte spread (`{...props}`) may carry the `type` and is
  not reported.
why: >-
  A button without a type is a submit button, so inside a form a click sends the form, which is
  rarely meant for a button that opens a menu or toggles a panel.

  To fix, add `type="button"`, or `type="submit"` if it should submit.
example: '<button>Go</button>   <button type="button">Go</button>'
severity: off
category: suspicious
rule:
  kind: StartTag
  regex: '(?i)^<button\b'
  not-has: { kind: Attribute, regex: '(?i)^(type\b|\{\s*\.\.\.)' }
report-on: first-token
