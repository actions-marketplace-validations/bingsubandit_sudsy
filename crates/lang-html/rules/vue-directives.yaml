message: "`v-text` needs an expression and takes no argument or modifier"
description: >-
  Reports a `v-text` that has no expression, an argument or a modifier.
why: >-
  Without an expression the directive fails to compile or shows nothing.

  To fix, write `v-text="msg"`.
example: "<p v-text>   <p v-text=\"msg\">"
severity: warn
category: correctness
