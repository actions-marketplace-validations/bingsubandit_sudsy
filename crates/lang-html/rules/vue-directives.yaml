id: valid-v-is
family: template
params: { name: v-is, value: required, no-arg: true, modifiers: none }
message: "`v-is` needs an expression and takes no argument or modifier"
description: >-
  Reports a `v-is` that has no expression, an argument or a modifier.
why: >-
  Without an expression the directive fails to compile.

  To fix, write `v-is="name"`.
example: "<tr v-is>   <tr v-is=\"name\">"
severity: warn
category: correctness
---
id: valid-v-memo
family: template
params: { name: v-memo, value: required, no-arg: true, modifiers: none }
message: "`v-memo` needs an expression and takes no argument or modifier"
description: >-
  Reports a `v-memo` that has no expression, an argument or a modifier.
why: >-
  Without a list of values the directive fails to compile and the subtree is never cached.

  To fix, write `v-memo="[a, b]"`.
example: "<p v-memo>   <p v-memo=\"[a, b]\">"
severity: warn
category: correctness
---
id: valid-v-once
family: template
params: { name: v-once, value: forbidden, no-arg: true, modifiers: none }
message: "`v-once` takes no expression, argument or modifier"
description: >-
  Reports a `v-once` that has an expression, an argument or a modifier.
why: >-
  The directive takes no value; a value is ignored, so the author believes there is a condition that
  does not exist.

  To fix, write `v-once` alone.
example: "<p v-once=\"x\">   <p v-once>"
severity: warn
category: correctness
---
