id: valid-v-show
family: template
params: { name: v-show, value: required, no-arg: true, modifiers: none }
message: "`v-show` needs an expression and takes no argument or modifier"
description: >-
  Reports a `v-show` that has no expression, an argument or a modifier.
why: >-
  Without an expression the directive fails to compile or never changes the element.

  To fix, write `v-show="open"`.
example: "<p v-show>   <p v-show=\"open\">"
severity: warn
category: correctness
