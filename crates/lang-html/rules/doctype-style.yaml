id: doctype-style
message: write DOCTYPE in uppercase
description: >-
  Reports a doctype keyword that is not in uppercase (`<!doctype html>`).
why: >-
  The keyword is case-insensitive, so the browser does not care; uppercase is the form the
  specification and most documents use, and one form keeps the files alike.

  To fix, write `<!DOCTYPE html>`.
example: '<!doctype html>   <!DOCTYPE html>'
severity: off
category: style
rule:
  kind: Doctype
token: { kind: [DoctypeKw], regex: '[a-z]' }
