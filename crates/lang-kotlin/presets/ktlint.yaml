# ktlint's ktlint_official rules that Sudsy has, at warn, with their default options.
kotlin:
  lint:
    rules:
      argument-list-wrapping: warn
      class-signature: warn
      function-signature: warn
      parameter-list-wrapping: warn
      trailing-comma-on-call-site: warn
      trailing-comma-on-declaration-site: warn
      multiline-expression-wrapping: warn
      chain-method-continuation: warn
      function-expression-body: warn
      multiline-if-else: warn
      when-entry-bracing: warn
      statement-wrapping: warn
      class-naming: warn
      comment-space: warn
      curly:
        level: warn
        options:
          style: chain
      enum-entry-name-case: warn
      max-line-length: warn
      modifier-order: warn
      no-empty-class-body: warn
      no-empty-file: warn
      no-unit-return: warn
      no-wildcard-imports: warn
      package-name: warn
      unused-import: warn
