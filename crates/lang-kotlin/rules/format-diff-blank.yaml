id: blank-line-between-when-conditions
family: format-diff
params: { kind: WhenEntry, change: blank, at: start, message: "the blank line before the when entry is as the formatter writes it" }
description: >-
  Reports a `when` entry with a blank line before it that the formatter would add or remove.
why: >-
  Blank lines between the entries of a `when` are laid out by one rule, so the spacing does not
  depend on the author and is not changed by hand.

  To fix, run the formatter.
example: 'val a = when (b) {\n    1 -> c()\n\n    else -> d()\n}'
severity: off
category: style
---
id: blank-line-between-declarations
family: format-diff
params: { kind: "Fun Property Class ObjectDeclaration Typealias", change: blank, at: start, leading: comments, message: "the blank line before the declaration is as the formatter writes it" }
description: >-
  Reports a declaration (function, property, class, object, typealias) with a blank line before it
  that the formatter would add or remove. Declarations with comments or annotations before them are
  included.
why: >-
  Blank lines show where one declaration ends and the next one begins. A file that is consistent
  shows the structure at a glance, and a formatter that keeps the same spacing does not turn up as a
  diff on each save.

  To fix, run the formatter.
example: 'val a = 1\nfun f() {}'
severity: off
category: style
