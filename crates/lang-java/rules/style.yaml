id: array-type-style
message: 'write the array brackets after the type: `int[] a`, not `int a[]`'
description: >-
  A declarator or parameter with C-style brackets after the name (Checkstyle ArrayTypeStyle).
example: 'int a[];'
severity: off
category: style
rule:
  any: [{ kind: VariableDeclarator }, { kind: FormalParameter }, { kind: SpreadParameter }]
  child: { kind: Dimension }
