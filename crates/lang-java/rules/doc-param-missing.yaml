id: doc-param-missing
family: doc-param-missing
params:
  message: "the Javadoc for parameter `{name}` is missing"
  declarations: method-declaration|constructor-declaration
  name: Identifier:last
  param: '@param\s+(\w+)'
  skip-doc: '\{@inheritDoc\}'
  visible: public protected
  implicit-public-in: interface @interface
description: >-
  A parameter of a documented public or protected method or constructor that has no `@param` tag
  in its Javadoc (Checkstyle JavadocMethod). A comment with `{@inheritDoc}` is left out, and so is
  a declaration without a comment. No fix.
example: "/** Adds. */\npublic int add(int a) { return a; }   // add @param a"
severity: off
category: style
