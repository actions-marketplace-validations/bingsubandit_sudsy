id: todo-comment
family: todo-comment
params:
  message: '`TODO:` must be written in all caps and followed by a colon'
  word: todo
  required: 'TODO:'
description: >-
  Reports a line of a comment that starts with `todo` in any other case, or with `TODO` and no
  colon. Javadoc comments are not read.
why: >-
  A fixed form (`TODO:`) lets people and tools find the open items by one search. A variant spelled
  differently is not found.

  To fix, write `TODO:`.
example: '// todo fix'
severity: off
category: style
