id: doc-paragraph
family: doc-comment
params:
  check: paragraph
description: >-
  Reports Javadoc paragraphs that do not use `<p>` in the usual way: a `<p>` must stand right before
  the first word of its paragraph (no space after it) and after an empty line, an empty line between
  paragraphs must be followed by `<p>`, and the comment must not start with `<p>`. Text inside
  `<pre>`, `<ul>` and the like, and after the first block tag, is not checked.
why: >-
  Javadoc ignores empty lines, so paragraphs not marked with `<p>` run together in the generated
  page. A `<p>` that is misplaced adds an empty paragraph or starts a paragraph in the wrong place.

  To fix, put `<p>` directly before the first word of each paragraph after the first.
example: "/**\n * One.\n * <p> Two.\n */\nclass A {}"
severity: off
category: style
---
id: doc-summary
family: doc-comment
params:
  check: summary
description: >-
  Reports a Javadoc comment that does not start with a summary: the first sentence must end with a
  period followed by a blank or the end of the text, and must not start with a fragment that matches
  the `forbidden_fragments` option. A comment that is `{@inheritDoc}` or `{@return ...}` needs no
  summary.
why: >-
  The first sentence is what the generated index and the IDE hover show, so a comment that does not
  start with a complete sentence gives a poor summary or one cut at the wrong place.

  To fix, begin the comment with a sentence that ends with a period.
example: "/** no period */\nclass A {}"
severity: off
category: style
options:
  - { name: forbidden_fragments, type: regex, default: "", description: "Regular expression a summary must not match at its start; empty: no check." }
---
id: doc-asterisk
family: doc-comment
params:
  check: asterisk
description: >-
  Reports a line of a Javadoc comment, after the first, that does not start with an asterisk. Empty
  lines are not reported.
why: >-
  Javadoc strips the leading `*` of each line, so a line without one is kept with its indentation,
  and the comment renders differently from how it reads in the source. The asterisks also show where
  the comment ends.

  To fix, start the line with `*`.
example: "/**\n   text\n */\nclass A {}"
severity: off
category: style
---
id: doc-tag-indent
family: doc-comment
params:
  check: tag-indent
description: >-
  Reports a line that continues a block tag (`@param x`) and is indented by fewer than `indent`
  blanks after the asterisk (5 by default). Lines that start HTML and lines inside `<pre>` and the
  like are not reported.
why: >-
  The indent shows that a line belongs to the tag above it: without it a long `@param` description
  reads as a paragraph of the comment.

  To fix, indent the continuation lines.
example: "/**\n * @param x a\n * b\n */\nclass A {}"
severity: off
category: style
options:
  - { name: indent, type: int, default: 5, description: "Blanks after the asterisk that a continuation line needs." }
