id: var-naming
family: naming-convention
params:
  names: function&+name=name|function&+name=parameters/ParameterDeclaration/Ident:each|function&+name=parameters/VariadicParameterDeclaration/Ident:each|function&+name=result/ParameterDeclaration/Ident:each|signature&+name=parameters/ParameterDeclaration/Ident:each|signature&+name=parameters/VariadicParameterDeclaration/Ident:each|signature&+name=result/ParameterDeclaration/Ident:each|const-spec=Ident:each|var-spec=Ident:each|type-spec|local-declaration=left/Ident:each|field-declaration=FieldIdent:each
  message: "{name} should be {suggestion}"
description: >-
  Reports a name that is not spelled in Go style: it has an underscore, it is a constant in
  ALL_CAPS, or it writes a common initialism (`Id`, `Http`, `Url`) in mixed case. Checked are
  functions and methods with their parameters and results, the methods of interfaces (their
  parameters and results, not their names), constants, variables, types, the names of `:=` and the
  fields of structs. Receivers, function literals and function types are not checked. The options
  `initialisms` and `ignore_pattern` change the words and names.
why: >-
  Go code is read with the conventions of the standard library, where `userID` and `ServeHTTP` are
  written the same everywhere. A name that follows another style stands out and makes grep and
  completion less predictable.

  To fix, rename to mixed caps with initialisms in capitals: `userID`, not `user_id` or `userId`.
example: "var user_name int"
severity: off
category: style
options:
  - { name: names, type: string, default: words, choices: [words, "off"], description: "The convention of the names: `words` or `off`." }
  - { name: initialisms, type: list, default: [ACL, API, ASCII, CPU, CSS, DNS, EOF, GUID, HTML, HTTP, HTTPS, ID, IDS, IP, JSON, LHS, QPS, RAM, RHS, RPC, SLA, SMTP, SQL, SSH, TCP, TLS, TTL, UDP, UI, UID, UUID, URI, URL, UTF8, VM, XML, XMPP, XSRF, XSS], description: "The words (in capitals) that are written in capitals inside a name." }
  - { name: ignore_pattern, type: regex, default: "^(LastInsertId|kWh)$", description: "A regex for the names that are not checked." }
