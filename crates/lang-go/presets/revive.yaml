# The rules of revive's default set that Sudsy has, at warn (the rest are in docs/ai/parity/revive.yaml).
go:
  lint:
    rules:
      doc-first-word: warn
      missing-doc-comment: warn
      missing-package-comment: warn
      package-comment-form: warn
      redefines-builtin-id: warn
      unused-parameter: warn
      var-naming: warn
# revive checks the doc comments of non-test files only.
overrides:
  - files: ["**/*_test.go"]
    go:
      lint:
        rules:
          doc-first-word: "off"
          missing-doc-comment: "off"
          package-comment-form: "off"
  # revive leaves the names of tests, examples and benchmarks alone in a test file.
  - files: ["**/*_test.go"]
    go:
      lint:
        rules:
          var-naming:
            level: warn
            options:
              ignore_pattern: "^(LastInsertId|kWh|(Example|Test|Benchmark|Fuzz).*)$"
