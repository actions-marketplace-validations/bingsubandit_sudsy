# The rules of revive's default set that Sudsy has, at warn (the rest are in docs/ai/parity/revive.yaml).
go:
  lint:
    rules:
      no-wildcard-imports: warn
      doc-first-word: warn
      error-naming: warn
      error-strings: warn
      errorf: warn
      increment-decrement: warn
      indent-error-flow: warn
      missing-doc-comment: warn
      missing-package-comment: warn
      no-empty-block:
        level: warn
        options:
          comment_handles: false
          waiting_loops: true
          ignored_loop_heads: "^range\\b"
      package-comment-form: warn
      range: warn
      receiver-name-consistent: warn
      receiver-naming: warn
      redefines-builtin-id: warn
      superfluous-else: warn
      unreachable-code: warn
      unused-parameter: warn
      var-naming: warn
# revive checks the doc comments of non-test files only.
overrides:
  - files: ["**/*_test.go"]
    go:
      lint:
        rules:
          doc-first-word: "off"
          missing-doc-comment: "off"
          package-comment-form: "off"
  # revive leaves the names of tests, examples and benchmarks alone in a test file.
  - files: ["**/*_test.go"]
    go:
      lint:
        rules:
          var-naming:
            level: warn
            options:
              ignore_pattern: "^(LastInsertId|kWh|(Example|Test|Benchmark|Fuzz).*)$"
