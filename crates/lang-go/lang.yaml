vscode-languages: [go]
grammar-crate: tree-sitter-go
grammar-path: grammars/tree-sitter-go
extensions: [go]
formatter: 'core_format::VerbatimFormatter { exact_end: &[] }'
dev-deps: [insta]
options:
  - indent_style
  - final_newline: true
  - end_of_line
presets: [revive]
mapping:
  same: 'source_file package_clause import_declaration import_spec import_spec_list function_declaration method_declaration type_parameter_list type_parameter_declaration parameter_list parameter_declaration variadic_parameter_declaration const_declaration const_spec var_declaration var_spec var_spec_list type_declaration type_spec type_alias type_arguments type_elem type_constraint array_type implicit_length_array_type slice_type struct_type field_declaration_list field_declaration pointer_type function_type interface_type method_elem map_type channel_type qualified_type generic_type negated_type parenthesized_type block statement_list expression_statement labeled_statement empty_labeled_statement break_statement continue_statement goto_statement return_statement go_statement defer_statement if_statement expression_switch_statement type_switch_statement expression_case type_case default_case select_statement communication_case for_statement for_clause range_clause send_statement receive_statement inc_statement dec_statement assignment_statement short_var_declaration expression_list parenthesized_expression call_expression argument_list variadic_argument selector_expression index_expression slice_expression type_assertion_expression type_conversion_expression type_instantiation_expression binary_expression unary_expression composite_literal literal_value literal_element keyed_element'
  FuncLiteral: func_literal
  Comment: comment
  Ident: identifier
  FieldIdent: field_identifier
  TypeIdent: type_identifier
  PackageIdent: package_identifier
  LabelName: label_name
  BlankIdent: blank_identifier
  DotImport: dot
  Int: int_literal
  Float: float_literal
  Imaginary: imaginary_literal
  Rune: rune_literal
  String: interpreted_string_literal raw_string_literal
  Nil: nil
  "True": 'true'
  "False": 'false'
  Iota: iota
  Fallthrough: fallthrough_statement
  EmptySemi: empty_statement
  Open: '( [ {'
  Close: ') ] }'
  Punct: ', ; : . ...'
  Define: ':='
  Assign: '= %= &= &^= *= += -= /= <<= >>= ^= |='
  Op: '! != % & && &^ * + ++ - -- / < <- << <= == > >= >> ^ | || ~'
  Keyword: break case chan const continue default defer else for func go goto if import interface map package range return select struct switch type var
  wrap: {Fallthrough: FallthroughStatement, EmptySemi: EmptyStatement}
