id: zypper-pin-versions
family: run-command
params: { program: 'zypper', args: 'install in', pinned: '[=<>]|\.rpm$' }
message: 'pin the versions in zypper install: pkg=version'
description: >-
  Reports a `zypper install` (`in`) of a package without a version. A package is pinned when its
  name has `=`, `<` or `>` (`curl=7.88.1`) or when it is a `.rpm` file.
why: >-
  An unpinned install takes the newest version in the enabled repositories on the day of the build.
  Two builds of one Dockerfile can then differ, and a new release can break the image without any
  change in your code.

  Pinned versions make the build repeatable. Repositories drop old versions, so a pin needs updating
  from time to time.
example: 'RUN zypper install -y curl'
severity: off
category: suspicious
