id: doc-returns-required
family: doc-element
params: { check: required, element: returns, scope: returning, skip-inheritdoc: true, report: return-type }
message: "the return value should be documented with <returns>"
description: >-
  Reports a documented method or delegate that does not return `void` and has no `<returns>` (and no
  `<inheritdoc />`). Private members are not reported. No fix.
why: >-
  The summary says what a method does, and `<returns>` says what comes back, which a caller needs to
  use it right: units, meaning of `null`, which failure value.

  To fix, add a `<returns>` that describes the value.
example: "/// <summary>Counts.</summary>\npublic int Count() => 0;   // add <returns>"
severity: off
category: style
