id: doc-partial-summary-text
family: doc-element
params: { check: text, element: summary, scope: summary, partial: only, skip-inheritdoc: true, fallback: content, report: names }
message: "the <summary> of a partial element should have text"
description: >-
  Reports a partial type or method whose `<summary>` (or `<content>`) has no text. Each part is
  checked on its own. No fix.
why: >-
  An empty summary is shown in a list or a hover as no description, and it hides that nobody wrote
  one.

  To fix, write the summary.
example: "/// <summary></summary>\npublic partial class A { }   // describe it"
severity: off
category: style
