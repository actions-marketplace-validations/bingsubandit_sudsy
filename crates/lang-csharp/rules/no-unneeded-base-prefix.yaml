id: no-unneeded-base-prefix
family: finding
params: { check: base_call, fix-title: "Use `this`" }
message: "do not prefix the call with `base`: this type does not override the member"
description: >-
  Reports `base.M()` or `base[i]` where the type does not override the member, so `this` binds to
  the same one. The fix writes `this`.
why: >-
  `base.` says that the call goes to the parent on purpose, and a reader looks for the override that
  makes this necessary. When there is none, `this.M()` is the same call, and the `base` is a
  misleading hint.
example: "class B : A { void M() { base.Run(); } }   // no override of Run: write this.Run()"
severity: off
category: style
requires: [types]
fix-kind: safe
