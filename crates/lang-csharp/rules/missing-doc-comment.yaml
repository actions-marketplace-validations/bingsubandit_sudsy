id: missing-doc-comment
family: missing-doc-comment
params:
  message: "`{name}` needs a documentation comment"
  doc-start: "///"
  report-at: name
  visible: public protected internal
  implicit-public-in: interface enum
  top-level-visible: true
  visible-with: explicit_interface_specifier
  skip: partial
  types: type-declaration
  outer.types: public protected internal
  members: method-declaration|constructor-declaration|destructor-declaration|delegate-declaration|property-declaration|event-declaration|operator-declaration=operator_keyword|conversion-operator-declaration=operator_keyword|indexer-declaration=this_keyword
  outer.members: public protected internal
  fields: field-declaration=declaration/variables/identifier|event-field-declaration=declaration/variables/identifier
  outer.fields: public protected internal
  enum-items: enum-constant
  outer.enum-items: public protected internal
description: >-
  Reports a type, member, field or enum item that needs documentation and has no `///` comment
  before it: public, protected or internal ones, in types that are too. Members of an interface,
  explicit interface implementations and enum items count as public. Partial declarations are not
  reported, and private members are not either. No fix.
example: "public class C\n{\n    public int Count;   // add a /// <summary>\n}"
severity: off
category: style
