id: inheritdoc-on-inheriting-member
family: finding
params: { check: inheritdoc }
message: "`inheritdoc` is only for members that override or implement something"
description: >-
  Reports `<inheritdoc />` without `cref` on a type that has no base list, or on a member that
  neither overrides nor implements anything. A constructor whose signature matches a base
  constructor is not reported. No fix.
why: >-
  `inheritdoc` takes the documentation from what the member inherits. If it inherits nothing, the
  tool has no text to copy, and the member is shown without documentation although the comment looks
  complete.

  To fix, write the documentation, or name the source with `cref`.
example: "/// <inheritdoc />\npublic void Run() { }   // implements nothing"
severity: off
category: style
requires: [types]
