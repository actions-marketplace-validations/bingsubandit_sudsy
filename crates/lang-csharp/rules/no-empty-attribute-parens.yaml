id: no-empty-attribute-parens
message: the attribute has empty parentheses
description: >-
  Reports an attribute with empty parentheses: `[Foo()]` is `[Foo]`. Parentheses with a comment in
  them are not reported. The fix removes the parentheses.
why: >-
  The parentheses add two characters and no meaning: the attribute is constructed in both cases with
  its parameterless constructor.
example: "[Obsolete()]   // write: [Obsolete]"
severity: off
category: style
rule:
  kind: AttributeArgumentList
  regex: '^\(\s*\)$'
report-on: first-token
fix: ""
fix-trim-before: true
fix-title: Remove the parentheses
fix-kind: safe
