id: doc-value-text
family: doc-element
params: { check: text, element: value, scope: property, skip-inheritdoc: true, report: names }
message: "the <value> should have text"
description: >-
  Reports a property's `<value>` without text (`<value></value>`; `<value />` is not reported). A
  comment with `<inheritdoc />` is not reported. No fix.
why: >-
  An empty `<value>` is a placeholder: it satisfies a check that the tag exists and gives the reader
  nothing about what the property holds.

  To fix, describe the value.
example: "/// <value></value>\npublic int Count { get; }   // describe it"
severity: off
category: style
