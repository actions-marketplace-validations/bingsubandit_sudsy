id: no-empty-delegate-parens
message: the anonymous method has an empty parameter list
description: >-
  Reports an anonymous method with an empty parameter list: `delegate() { }` is `delegate { }`.
  Parentheses with a comment in them are not reported. The fix is unsafe: without a parameter list
  the method also converts to delegate types that have parameters, which can change which overload
  is chosen.
why: >-
  `delegate { }` is the shorter spelling of the same body, and the empty parentheses add nothing to
  read. They are not always the same to the compiler: the form without a list also converts to
  delegate types that have parameters, which can change which overload is chosen, and that is why
  the fix is unsafe.
example: "Action a = delegate() { };   // write: delegate { }"
severity: off
category: style
rule:
  kind: ParameterList
  regex: '^\(\s*\)$'
  parent: { kind: AnonymousMethodExpression }
report-on: first-token
fix: ""
fix-trim-before: true
fix-title: Remove the parentheses
fix-kind: unsafe
