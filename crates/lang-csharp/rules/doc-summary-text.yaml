id: doc-summary-text
family: doc-element
params: { check: text, element: summary, scope: summary, partial: no, report: names }
message: "the <summary> should have text"
description: >-
  Reports a `<summary>` without text (`<summary></summary>`; `<summary />` is not reported). Partial
  types and methods belong to `doc-partial-summary-text`. No fix.
why: >-
  An empty summary is a placeholder that was never filled in: it satisfies a check that a summary
  exists and tells the reader nothing.

  To fix, write the summary.
example: "/// <summary></summary>\npublic int Count;   // describe it"
severity: off
category: style
