id: keyword-case
family: token-case
params: { option: keyword_case, message: "write `{name}` as `{fixed}`" }
description: >-
  Keywords are not all in one case: with the `policy` option `consistent` the first one written fixes
  the case (`upper`, `lower` or `capitalise`) and a later one that cannot be in it is reported; the
  other values name the case. The fix writes the word in that case; with `consistent` that is the
  case the words settled on (sqlfluff CP01).
example: "SELECT a from t   # from is reported"
severity: off
category: style
fix-kind: safe
options:
  - { name: policy, type: string, default: consistent, choices: [consistent, upper, lower, capitalise], description: "The case the words must be in: `consistent` follows the first one written." }
---
