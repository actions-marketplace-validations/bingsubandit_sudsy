id: group-order-style
family: clause-style
params: { message: "this clause lists columns differently from the other GROUP BY and ORDER BY clauses", clauses: "GroupbyClause,OrderbyClause", explicit: "ObjectReference,Expression", implicit: Number }
description: >-
  A `GROUP BY` or `ORDER BY` clause that lists both column names or expressions and column
  positions (`1`, `2`), or that lists them the other way from the first such clause of the file
  (sqlfluff AM06).
example: 'select a, b from t group by a, 2'
severity: off
category: style
