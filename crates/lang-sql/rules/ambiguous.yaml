id: group-order-style
message: this clause mixes column positions with column names
description: >-
  A `GROUP BY` or `ORDER BY` clause that lists both column names or expressions and column
  positions (`1`, `2`). A clause that contradicts the style of an earlier one is not reported
  (sqlfluff AM06).
example: 'select a, b from t group by a, 2'
severity: off
category: style
rule:
  any: [{ kind: GroupbyClause }, { kind: OrderbyClause }]
  child-token: [Number]
  child: { any: [{ kind: ObjectReference }, { kind: Expression }] }
