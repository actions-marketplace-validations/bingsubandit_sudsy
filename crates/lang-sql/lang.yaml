extensions: [sql]
formatter: SqlFormatter
parse: adapter::parse_file
options:
  - dialect:
      values: ["ansi", "postgres", "mysql", "tsql"]
      default: "ansi"
      doc: "The SQL dialect the file is parsed as."
  - line_width: 80
  - indent_style
  - indent_size: 4
  - final_newline: true
  - end_of_line
