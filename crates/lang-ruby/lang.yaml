vscode-languages: [ruby]
extensions: [rb, rake, gemspec, ru]
file-names: [Gemfile, Rakefile, Guardfile, Capfile]
formatter: FORMAT
format-rows: {source-indent: true, exact-end: [Data], keep-comment-gap: true}
parse: adapter::parse_file
options:
  - indent_size: 2
  - line_width: 120
  - indent_style
  - final_newline: true
  - max_blank_lines: [1, "Largest number of blank lines kept between lines (RuboCop Layout/EmptyLines)."]
  - end_of_line
families: rules::FAMILIES
presets: [rubocop]
