vscode-languages: [ruby]
extensions: [rb, rake, gemspec, ru]
file-names: [Gemfile, Rakefile, Guardfile, Capfile]
formatter: 'core_format::VerbatimFormatter { exact_end: &[generated::kind::DATA] }'
parse: adapter::parse_file
options:
  - indent_size: 2
  - line_width: 120
  - indent_style
  - final_newline: true
  - end_of_line
families: rules::FAMILIES
presets: [rubocop]
