tool: "angular-eslint"
version: "20.7.0"
languages: ["angular"]
sources:
  - "https://github.com/angular-eslint/angular-eslint/tree/v20.7.0/packages/eslint-plugin-template/docs/rules"
scope: "@angular-eslint/eslint-plugin-template's rules for `*.component.html`; the recommended ones first. Rules about TypeScript components are not in it."
entries:
  alt-text: planned
  attributes-order: planned
  banana-in-box: rule banana-in-box
  button-has-type: rule no-implicit-button-type
  click-events-have-key-events: planned
  conditional-complexity: deferred
  cyclomatic-complexity: deferred
  elements-content: planned
  eqeqeq: rule eqeqeq | `allowNullOrUndefined` is not an option
  i18n: deferred
  interactive-supports-focus: planned
  label-has-associated-control: planned
  mouse-events-have-key-events: planned
  no-any: deferred
  no-autofocus: planned
  no-call-expression: deferred
  no-distracting-elements: planned
  no-duplicate-attributes: planned
  no-empty-control-flow: planned
  no-inline-styles: rule no-inline-style
  no-interpolation-in-attributes: planned
  no-negated-async: rule no-negated-async | `!(x | async)` and `(x | async) === false`
  no-nested-tags: deferred
  prefer-contextual-for-variables: deferred
  prefer-control-flow: planned
  prefer-ngsrc: planned
  prefer-self-closing-tags: planned
  prefer-static-string-properties: deferred
  prefer-template-literal: deferred
  role-has-required-aria: planned
  table-scope: planned
  use-track-by-function: deferred
  valid-aria: planned
  no-positive-tabindex: planned
  prefer-at-else: planned
  prefer-at-empty: planned
  prefer-built-in-pipes: planned
