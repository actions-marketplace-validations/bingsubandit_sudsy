tool: "eslint-plugin-vue"
version: "10.12.1"
languages: ["vue"]
sources:
  - "https://eslint.vuejs.org/rules/"
scope: "eslint-plugin-vue's template rules (the `vue/` rules that read the `<template>` tree); rules about `<script>` come with the JS semantic layer"
entries:
  attribute-hyphenation: rule attribute-hyphenation
  attributes-order: planned
  component-name-in-template-casing: planned
  html-closing-bracket-newline: formatter | the formatter owns layout
  html-indent: formatter | the formatter owns layout
  html-quotes: rule attr-quotes
  html-self-closing: planned
  max-attributes-per-line: formatter | `single_attribute_per_line` and the line width
  multiline-html-element-content-newline: formatter | the formatter owns layout
  mustache-interpolation-spacing: planned
  no-duplicate-attributes: rule no-duplicate-keys | repeated `v-on` handlers and slots are allowed, and `class` next to `:class` is not a repeat
  no-multi-spaces: formatter | the formatter owns layout
  no-parsing-error: rule syntax-error
  no-spaces-around-equal-signs-in-attribute: rule attr-delimiter
  no-template-shadow: planned
  no-use-v-if-with-v-for: rule no-use-v-if-with-v-for
  no-v-html: rule no-v-html
  no-v-text-v-html-on-component: planned
  one-component-per-file: deferred | needs script analysis (the JS semantic layer)
  require-v-for-key: rule v-for-key
  singleline-html-element-content-newline: formatter | the formatter owns layout
  v-bind-style: rule v-bind-style
  v-on-style: rule v-on-style
  v-slot-style: rule v-slot-style
  valid-v-bind: rule valid-v-bind
  valid-v-else: rule valid-v-else
  valid-v-else-if: rule valid-v-else-if
  valid-v-for: rule valid-v-for
  valid-v-if: rule valid-v-if
  valid-v-model: rule valid-v-model
  valid-v-on: rule valid-v-on
  valid-v-slot: rule valid-v-slot
  no-dupe-v-else-if: deferred | needs a comparison of expressions
  no-lone-template: rule no-lone-template
  no-multiple-template-root: planned
  no-reserved-component-names: planned
  no-template-key: planned
  no-textarea-mustache: rule no-textarea-mustache
  no-unused-vars: deferred | needs script analysis (the JS semantic layer)
  no-unused-components: deferred | needs script analysis (the JS semantic layer)
  require-component-is: rule require-component-is
  require-prop-types: deferred | needs script analysis (the JS semantic layer)
  require-valid-default-prop: deferred | needs script analysis (the JS semantic layer)
  no-mutating-props: deferred | needs script analysis (the JS semantic layer)
  no-side-effects-in-computed-properties: deferred | needs script analysis (the JS semantic layer)
  no-async-in-computed-properties: deferred | needs script analysis (the JS semantic layer)
  no-ref-as-operand: deferred | needs script analysis (the JS semantic layer)
  no-unused-properties: deferred | needs script analysis (the JS semantic layer)
  no-undef-components: deferred | needs script analysis (the JS semantic layer)
  no-undef-properties: deferred | needs script analysis (the JS semantic layer)
  first-attribute-linebreak: formatter | the formatter owns layout
  html-closing-bracket-spacing: formatter | the formatter owns layout
  html-comment-content-newline: formatter | the formatter owns layout
  html-comment-content-spacing: formatter | the formatter owns layout
  html-comment-indent: formatter | the formatter owns layout
  padding-line-between-blocks: formatter | the formatter owns layout
  padding-line-between-tags: formatter | the formatter owns layout
  block-tag-newline: formatter | the formatter owns layout
  block-lang: planned
  block-order: planned
  html-button-has-type: rule no-implicit-button-type | a missing `type` only, not an invalid value
  html-end-tags: planned
  max-lines-per-block: planned
  max-template-depth: planned
  no-bare-strings-in-template: planned
  no-child-content: rule no-child-content
  no-content-outside-block: planned
  no-custom-modifiers-on-v-model: planned
  no-deprecated-filter: planned
  no-deprecated-functional-template: rule no-deprecated-functional-template
  no-deprecated-html-element-is: rule no-deprecated-html-element-is
  no-deprecated-inline-template: rule no-deprecated-inline-template
  no-deprecated-scope-attribute: rule no-deprecated-scope-attribute
  no-deprecated-slot-attribute: rule no-deprecated-slot-attribute
  no-deprecated-slot-scope-attribute: rule no-deprecated-slot-scope-attribute
  no-deprecated-v-bind-sync: rule no-deprecated-v-bind-sync
  no-deprecated-v-is: rule no-deprecated-v-is
  no-deprecated-v-on-native-modifier: rule no-deprecated-v-on-native-modifier
  no-deprecated-v-on-number-modifiers: rule no-deprecated-v-on-number-modifiers
  no-duplicate-class-names: planned
  no-empty-component-block: planned
  no-literals-in-template: planned
  no-multiple-slot-args: planned
  no-negated-v-if-condition: planned
  no-root-v-if: planned
  no-static-inline-styles: planned
  no-template-target-blank: rule no-target-blank
  no-use-v-else-with-v-for: planned
  no-useless-mustaches: planned
  no-useless-template-attributes: planned
  no-useless-v-bind: planned
  no-v-for-template-key-on-child: rule no-v-for-template-key-on-child
  no-v-text: rule no-v-text
