  no-props-shadow: planned
  no-ref-object-reactivity-loss: planned
  no-required-prop-with-default: planned
  no-reserved-keys: planned
  no-reserved-props: planned
  no-restricted-call-after-await: planned
  no-restricted-component-options: planned
  no-restricted-custom-event: planned
