  prefer-true-attribute-shorthand: planned
  require-toggle-inside-transition: planned
  slot-name-casing: planned
  static-class-names-order: planned
  this-in-template: planned
  use-v-on-exact: planned
  v-for-delimiter-style: planned
  v-if-else-key: planned
  v-on-event-hyphenation: planned
  v-on-handler-style: planned
  valid-attribute-name: planned
  valid-template-root: planned
  valid-v-cloak: rule valid-v-cloak
  valid-v-html: rule valid-v-html
  valid-v-is: rule valid-v-is
  valid-v-memo: rule valid-v-memo
  valid-v-once: rule valid-v-once
  valid-v-pre: rule valid-v-pre
  valid-v-show: rule valid-v-show
  valid-v-text: rule valid-v-text
  enforce-style-attribute: planned
  no-restricted-html-elements: planned | a configurable restriction list
  no-restricted-static-attribute: planned | a configurable restriction list
  no-restricted-v-bind: planned | a configurable restriction list
  no-restricted-v-on: planned | a configurable restriction list
  no-restricted-block: planned | a configurable restriction list
  no-restricted-class: planned | a configurable restriction list
  no-undef-directives: deferred | needs script analysis or the component graph
  no-unused-refs: deferred | needs script analysis or the component graph
  no-restricted-component-names: deferred | needs script analysis or the component graph
  match-component-file-name: deferred | needs script analysis or the component graph
  no-v-for-template-key: wontfix deprecated upstream
  no-v-model-argument: wontfix deprecated upstream
  valid-v-bind-sync: wontfix deprecated upstream
  array-bracket-newline: planned
  array-bracket-spacing: planned
  array-element-newline: planned
  arrow-spacing: planned
  block-spacing: planned
  brace-style: planned
  camelcase: planned
  comma-dangle: planned
  comma-spacing: planned
  comma-style: planned
  comment-directive: planned
  component-api-style: planned
  component-definition-name-casing: planned
