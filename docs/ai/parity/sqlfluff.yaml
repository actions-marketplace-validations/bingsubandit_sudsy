deferred:
  - gap: "Not exposed as an option."
    ids: [core.max_line_length]
  - gap: "Not exposed as an option until a preset needs it."
    ids: [indentation.indented_joins, indentation.indented_ctes, indentation.indented_using_on, indentation.indented_on_contents, indentation.indented_then, indentation.indented_then_contents, indentation.implicit_indents, indentation.skip_indentation_in, indentation.ignore_comment_lines, indentation.trailing_comments, layout.type, rules.capitalisation.ignore_words, rules.capitalisation.extended_capitalisation_policy]
  - gap: "Templated SQL (Jinja, dbt) is not rendered: a file with template tags does not parse and is refused."
    ids: [core.templater]
