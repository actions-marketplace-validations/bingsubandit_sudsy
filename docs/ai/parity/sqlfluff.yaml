scope: "Formatter (`sqlfluff fix` with the layout (LT) and capitalisation (CP) rules, our own layout code and parser); the linter covers the rules that catch bugs (aliasing, ambiguous, convention, structure) and plans the rest; templated rules (JJ) and T-SQL ones (TQ) are out"
