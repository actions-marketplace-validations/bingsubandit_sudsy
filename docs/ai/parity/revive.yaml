tool: "revive"
version: "1.17.1"
languages: ["go"]
sources:
  - "https://github.com/mgechev/revive/blob/v1.17.1/RULES_DESCRIPTIONS.md"
  - "https://github.com/mgechev/revive/blob/v1.17.1/defaults.toml"
scope: "The 23 rules of revive's default configuration (no config file: `defaults.toml`, confidence 0.8, files with the `Code generated ... DO NOT EDIT.` header skipped); the other rules need a configuration file that turns them on and are `deferred`. revive reads each file of a package with the package's other files (`package-comments`) and, for four rules, go/types (`var-declaration`, `unexported-return`, `context-keys-type`, `time-naming`); Sudsy reads one file at a time."
