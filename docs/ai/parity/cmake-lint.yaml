  - "https://cmake-format.readthedocs.io/en/latest/lint-summary.html"
  - "https://cmake-format.readthedocs.io/en/latest/lint-usage.html"
scope: "The 35 codes of cmake-lint of cmakelang (the package is GPL-3.0: only its output is compared, never its code or tables) with its default configuration (no config file). Three codes never fire at the defaults (probed on small inputs: C0102 has no blacklist pattern, R0914 and W0104 report nothing) and are `deferred`. The signature codes (E11xx, C0113) need a table of command signatures written from CMake's own documentation."
