tool: "gersemi"
version: "0.29.2"
languages: ["cmake"]
rule-url: none
sources:
  - "https://pypi.org/project/gersemi/0.29.2/"
  - "https://github.com/BlankSpruce/gersemi"
  - "tests/parity/gersemi (differential numbers, docs/ai/development/parity.md)"
scope: "The formatter of gersemi at its defaults (MPL-2.0: only its output is compared, never its code or tables). Differences in layout are measured by `scripts/parity.sh format gersemi` on the CMake corpus (tests/conformance/fetch-cmake-corpus.sh)."
entries:
  indent: option cmake.format.indent_size
  line_length: option cmake.format.line_width
  list_expansion: deferred | Phase 5 (keyword sections).
  definitions: deferred | User command definitions.
  unsafe: deferred | No unsafe mode.
  warn_about_unknown_commands: deferred | A warning of the tool, not a layout.
