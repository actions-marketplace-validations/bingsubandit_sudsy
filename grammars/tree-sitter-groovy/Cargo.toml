[package]
name = "tree-sitter-groovy"
description = "Groovy grammar for tree-sitter (fork of dekobon-tree-sitter-groovy 0.6.0, see FORK.md)"
version = "0.6.0"
license = "Apache-2.0 OR MIT"
edition.workspace = true
publish = false
autoexamples = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[build-dependencies]
cc = "1.2"
