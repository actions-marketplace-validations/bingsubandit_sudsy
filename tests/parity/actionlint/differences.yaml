differences:
  script-line: gap  a script rule is reported at the line of the text of a block scalar; actionlint reports it at the line of the `|`
  action-files: gap  the corpus feeds composite actions (`.github/actions/*/action.yaml`) to actionlint as workflows (13 structure findings); Sudsy lints workflows only
  self-hosted-labels: gap  a job with `self-hosted` is not checked for custom runner labels; actionlint wants them in its config
