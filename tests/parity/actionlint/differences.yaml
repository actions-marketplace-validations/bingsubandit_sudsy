differences:
  script-line: "gap  a script rule is reported at the line of the text inside a block scalar, actionlint at the line of the `|` (also its expression findings in a `run: |` block)"
  self-hosted-labels: "gap  a job with `self-hosted` is not checked for custom runner labels; actionlint wants them in its config and reports the others as unknown"
  undefined-alias-aborts: "gap  an undefined alias makes actionlint stop at \"could not parse as YAML\" (line 0) and report nothing else; Sudsy reports the alias and the unused anchor each at their line"
  duplicate-entry-dropped: "gap  actionlint drops a duplicated key or job before checking it; Sudsy still checks the second entry (steps missing, an unknown output property)"
  false-report: "gap  Sudsy reports what actionlint does not: `container: null` as an empty string, `options` on an input without `type` (docs/ai/bugs.md)"
  glob-check: "gap  a filter glob with a leading or trailing space in a `|` scalar and an unterminated `[` in a version are not checked"
  expression-checker: "gap  the expression checker lacks: contexts of the workflow `name`, expressions in env var names and credentials, `if: true` literals, matrix values of an `include`-only matrix, the outputs of known actions"
  event-checks: "gap  more than 25 workflow_dispatch inputs, and an activity type given through a YAML anchor (`types: &created [created]`) are not checked"
  empty-document: "gap  an empty file is not reported (\"workflow is empty\")"
  expression-valued-keys: "gap  a key that must be an expression or a literal is not checked: `required: yes`, a `required` text, `env: &anchor` with a scalar, `matrix: $text`"
  section-values: "gap  Sudsy lacks these structure messages: a null `steps:` is missing, an empty list item or `versions: ['']`, `snapshot` or `labels` of the wrong kind, an alias as a step, an anchored empty `with`, `permissions: \"\"`"
