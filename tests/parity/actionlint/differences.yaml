differences:
  script-line: gap  a script rule is reported at the line of the text of a block scalar; actionlint reports it at the line of the `|`
  action-files: gap  the corpus feeds composite actions (`.github/actions/*/action.yaml`) to actionlint as workflows (13 structure findings); Sudsy lints workflows only
  self-hosted-labels: gap  a job with `self-hosted` is not checked for custom runner labels; actionlint wants them in its config
  syntax-check-messages: gap  actionlint's structure messages that Sudsy's syntax-check rows lack, and findings Sudsy reports under another syntax-check message on the same line (expression-valued keys, empty sections, duplicate keys, runs-on forms); not yet split per message
  expression-checker: gap  no expression parser with types (type, context-availability and condition findings of an expression are missing), and a few are reported in the wrong place
  event-permission-ids: gap  actionlint reports an unknown event or permission scope under its own id; Sudsy reports the same line as a syntax-check finding, or not at all
  yaml-anchors: gap  anchors and aliases (unused, undefined, recursive and merge-key findings) differ in id or line
  glob-check: gap  no glob syntax check of branch, tag and path filters
