coverage: 81.8  # share of the default-set findings of actionlint on its corpus that Sudsy also reports with the preset that mirrors it (scripts/parity.sh coverage actionlint; at least 85% is the bar)
target: 81.8
fixes:  # lint rule -> where and what to change
  syntax-check: "rows in crates/lang-github-actions/src/shape.rs (core_rules::shape): missing messages are one-off sections (snapshot, environment string forms), typed defaults, anchors"
  expression/types: "no expression parser with types yet: needs a shared expression language (parse, types of contexts and functions)"
  expression/context: "which contexts a key allows: a table per key path read by the same expression checker"
  action/outdated-runner: "a table of popular actions whose major version runs on a retired runner (data read by shared Rust)"
  syntax-check/yaml: "anchors and aliases: unused anchor, recursive alias, merge key; a YAML-level check, shared with other YAML dialects"
  glob: "filter patterns of branches, tags and paths: a glob syntax check in a shared crate"
  if-cond: "an `if:` that is always true: needs the expression parser"
  events/inputs: "a typed default of a workflow_dispatch or workflow_call input: a shared check over type, default and options keys"
