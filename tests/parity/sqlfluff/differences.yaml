fixes:  # gap name or lint rule -> one line: where and what to change
  AM04: outermost SELECT with a wildcard whose source is a table; needs query analysis (CTE and subquery resolution) in a shared crate
  RF06: unnecessary quotes on an identifier; needs dialect casefold and reserved-word sets (lang-sql parse data) read by a shared rule
  RF02: unqualified column in a multi-table SELECT; needs column-reference analysis (table aliases, select scope)
  PRS: sqlfluff's own parse error on files it cannot read (162 files); Sudsy parses them, nothing to report
  CP02: misses are in files with a parse error (geometry, bit, int2, tsql hints); parse gaps first
  CP01: misses are in files with a parse error (text, cluster, collate); parse gaps first
  AL01: misses are in files with a parse error (geometry, int2)
  RF03: single-table SELECT with mixed qualified and unqualified references; column-reference analysis
  RF05: special characters in quoted identifiers; token rule over quoted identifier text
  AM06: GROUP BY and ORDER BY mixing column numbers and names; clause rule
  RF04: keywords as identifiers; unreserved keyword set of each dialect from parse data
  AL08: duplicate column alias in a select list; needs a select-list tag pair (a second language or a Rust rule)
