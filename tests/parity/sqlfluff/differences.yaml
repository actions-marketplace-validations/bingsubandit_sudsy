differences:
  parse-gap: gap  "sqruff's dialect does not parse what sqlfluff's does (a statement it lacks, `DELIMITER`, template tags), so the file is refused"
  layout-gap: gap  "the layout of our own (spacing, indentation, line breaks, commas, line length) is not written yet, the file stays as written"
  case-gap: gap  "the capitalisation of our own (keywords, identifiers, functions, types, literals) is not written yet, words stay as written"
files:
  sqlfluff-ansi: parse-gap, layout-gap, case-gap
  sqlfluff-mysql: parse-gap, layout-gap, case-gap
  sqlfluff-postgres: parse-gap, layout-gap, case-gap
  sqlfluff-tsql: parse-gap, layout-gap, case-gap
  postgres-regress: parse-gap, layout-gap, case-gap
ratchet:
  sqlfluff-ansi: 99
  sqlfluff-mysql: 117
  sqlfluff-postgres: 63
  sqlfluff-tsql: 26
  postgres-regress: 6
