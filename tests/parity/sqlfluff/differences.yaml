differences:
  parse-gap: gap  "our parser does not parse what sqlfluff's does (a statement it lacks, `DELIMITER`, template tags), so the file is refused"
  layout-gap: gap  "the layout of our own does not yet cover every construct (expressions, joins, CASE, CTEs, comments), those parts stay as written"
  non-utf8-input: gap  "sqlfluff reads a file in another encoding (postgres collate.windows.win1252.sql, Windows-1252); sudsy reads UTF-8 only, so the file stays unformatted and its layout findings count"
  if-condition-wrap: gap  "a tsql `IF` / `ELSE` body or a mysql `IF` condition is laid out differently from sqlfluff (the nesting of `ELSE IF`, a condition kept on its line, `SET @v` / `DECLARE` values broken before `=`)"
  identifier-case: gap  "the case of a word sqlfluff reads as a keyword, a column or a data type differs (`name`, `state`, `value`, `array`, `SYSNAME`, `DATETIME`, `default null` as literal or keyword)"
  tsql-block-indent: gap  "the indentation of `BEGIN` / `END` blocks and statements in T-SQL bodies differs"
  fix-loop-limit: gap  "the reference run leaves a large file as written or stops fixing it early (its run sets neither `large_file_skip_byte_limit` nor `runaway_limit`); not measured which, so the file is not a result of Sudsy"
