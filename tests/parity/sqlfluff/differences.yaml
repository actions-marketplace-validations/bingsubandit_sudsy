differences:
  parse-gap: gap  "our parser does not parse what sqlfluff's does (a statement it lacks, `DELIMITER`, template tags), so the file is refused"
  layout-gap: gap  "the layout of our own does not yet cover every construct (expressions, joins, CASE, CTEs, comments), those parts stay as written"
  non-utf8-input: gap  "sqlfluff reads a file in another encoding (postgres collate.windows.win1252.sql, Windows-1252); sudsy reads UTF-8 only, so the file stays unformatted and its layout findings count"
  if-condition-wrap: gap  "an `IF` / `WHEN` condition is laid out on its own lines where sqlfluff keeps `IF cond` on one line (tsql `IF OBJECT_ID(..) IS NULL EXEC(..)`), and mysql `if exists (` is kept together where sqlfluff breaks after `if`"
  type-args-split: gap  "a data type length in a column with a `CHARACTER SET` / `COLLATE` suffix is printed on three lines (`varchar(` / `256` / `)`, mysql); sqlfluff keeps `varchar(256)`"
  index-on-wrap: gap  "`CREATE INDEX name ON t (cols)` keeps `ON` on the line of the name and breaks inside the column list; sqlfluff puts `ON t (cols)` on its own indented line"
  identifier-case: gap  "the case of identifiers, keywords and type names that sqlfluff leaves as written (`VALUE`, `x::REGCLASS`, `ENGINE innodb`, parameter names) differs"
  tsql-block-end: "gap  tsql parse error at the `END` of a `BEGIN` block in a procedure or function body; the opening construct is not narrowed (smallest input: bugs.md)"
  datatype-case: gap  "the case of data type names (`BIGINT`, `varchar`) is changed where sqlfluff keeps it"
  tsql-end-semicolon-else: "gap  tsql parse error: `END;` followed by `ELSE`"
  indent-and-alignment: gap  "the indentation and column alignment of lines sqlfluff leaves as written (column definitions, aligned types) is re-indented"
  comment-layout: gap  "a block comment or a comment after a clause is moved or re-indented"
  language-name-case: gap  "`LANGUAGE C` / `LANGUAGE SQL` is lower-cased as an identifier"
  mysql-delimiter: "gap  mysql `DELIMITER` scripts: the file is refused (`DELIMITER d//` is an internal error of the meaning check, see bugs.md)"
  cast-spacing: gap  "`cast(` becomes `CAST (`"
  tsql-xml-methods: "gap  tsql parse error: `WITH XMLNAMESPACES` and the `.query()` / `.value()` methods of the xml type"
  tsql-set-option-before-go: "gap  tsql parse error: `SET <option> ON` without a semicolon before `GO` swallows the next `BEGIN` block"
  insert-values-wrap: gap  "`INSERT INTO t (cols) VALUES (...)` is broken over many lines; sqlfluff keeps the statement on one line"
  alter-table-wrap: gap  "`ALTER TABLE t ADD ...` actions are not put on their own indented line as sqlfluff does"
  tsql-other-syntax: "gap  tsql parse errors: `CREATE PROCEDURE n(@p ...)`, `#temp.[col]` references, `(NOLOCK)` on a function-like source"
  trailing-blanks: gap  "trailing blanks of lines in comments and strings are kept; sqlfluff removes them"
  table-option-spacing: gap  "`ENGINE=InnoDB` is printed `ENGINE = InnoDB`"
