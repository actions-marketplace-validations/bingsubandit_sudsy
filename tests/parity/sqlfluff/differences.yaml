target: 66.7
fixes:  # gap name or lint rule -> one line: where and what to change
  PRS: sqlfluff's own parse error on files it cannot read (162 files); Sudsy parses them, nothing to report
  CP05: bit strings (b'..'), ::regclass and tsql int column types in files Sudsy cannot parse; remaining parse errors (REPACK, tsql XML (DOCUMENT x), EXECUTE WITH RESULT SETS, OPENJSON WITH, JSON_TABLE PATH DEFAULT, RETURNS @t TABLE, mysql json_table)
  CP02: misses are in files with a parse error (the constructs listed under CP05)
  CP01: misses are in files with a parse error (the constructs listed under CP05)
  RF05: quoted names in statements the generic parse leaves as plain tokens (no ObjectReference)
  CV06: a semicolon after whitespace or a newline, and doubled semicolons; needs a token-neighbour check, planned until a second language needs it
  RF06: quoted names in files with a parse error, and tsql and mysql quoting; per-dialect naked identifier templates
  RF03: references of selects over table functions and nested queries
  AM06: clause-style family reports a clause against the first of the file; the rest are clauses sqlfluff checks inside a nested query
