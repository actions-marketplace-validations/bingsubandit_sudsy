flags:
  no-config: the tool runs with `--no-config` (and no editorconfig), so a project's own Prettier options are not applied; Sudsy's JS, CSS and HTML options for them are not mapped yet
  embedded-language-formatting-off: "Prettier runs with `--embedded-language-formatting=off`: the embedded CSS, GraphQL and HTML of JS are formatted by Sudsy's formatters, which differ"
fixes:
  unsupported-syntax: Add the syntax to the oxc adapter where oxc parses it; the rest stays an intentional input filter.
  ts-type-layout: crates/lang-js format/ts/types.rs - move union and type argument layout onto core-format shapes with Prettier options.
  comment-placement: core-format comments - handle placement by role tags, not per node kind.
  call-layout: core-format shapes call_arguments, call_chain and arrow.
  misc-statements: one case at a time; see the diffs with PARITY_FILTER.
  prettier-ignore: format directive handling in the shared layout for ignored nodes.
  template-literals: shared literal rules.
  decorators: core-format declaration annotations.
  no-semi: lang-js option `semi` handling in statement printing.
  jsx-layout: JSX shape.
  new-syntax: add the layout rows for the new nodes.
