differences:
  project-options: gap  real-world projects run under Prettier's defaults (`--no-config`), not their own Prettier options; the corpus fetches no config files and Sudsy's JS options are not mapped yet
  unsupported-syntax: gap  proposal and error-recovery syntax Sudsy rejects or cannot parse (discard bindings `void`, bind and pipeline operators, `do` and module blocks, `?.` assignment, v8 intrinsics, partial application, TS invalid code)
  ts-type-layout: gap  TS type layout (union and intersection breaking and parentheses, type parameter and argument lists, `as`/`satisfies`/cast parentheses, interface and property signature, import types)
  comment-placement: gap  where Prettier attaches and moves comments (before `else`, in arguments and parameters, around type casts, after operators, in class members, in empty bodies)
  call-layout: gap  call, member chain, last-argument expansion, arrow chain, test-call and sequence layout differences
  misc-statements: gap  statement and declaration layout cases - if/else with comments, for heads, labels, exports and imports, ternaries, class members, assignments, embedded languages
  prettier-ignore: gap  `// prettier-ignore` before a statement, member, property or type - the ignored node is not printed as written in every position
  template-literals: gap  template literal indentation and expressions, string quote choice and quote-props cases
  decorators: gap  decorator placement - same line or own line from the source, before or after `export`, with comments and parameters
  no-semi: gap  `semi=false` cases, the statements that need a leading `;` and class property edge cases
  jsx-layout: gap  JSX layout of comments, spread attributes and text fill
  new-syntax: gap  `using` declarations and import attributes / `with` clauses printed differently
