ratchet:
  fixtures: 1
  real-world: 70
target-files:
  fixtures: 1
  real-world: 81
second-format:
  real-world: 0
refused:
  real-world: 0
differences:
  array-pipeline: gap  an array whose elements are a backslash-continued pipeline is kept as written
  arith-spacing: gap  `i++ ))` (a blank before `))` after `++`, which tree-sitter-bash lexes as one word) and the subscripts `${a[i+1]}` are kept as written; shfmt writes `i++))` and `${a[i + 1]}`
  expr-kept: gap  `${v//x}` is kept (the formatter never adds tokens); shfmt writes `${v//x/}`
  continued-conditions: gap  an `if`/`elif` condition, a `case` arm or pattern, or a list or pipeline in `$(...)` continued with `\` (or over several lines with comments) is kept as written; shfmt breaks it after the operator
  brace-group-layout: gap  a `{ ...; }` group that is a whole `else` body or the head of a pipeline is laid out as a block; shfmt keeps `else {` and `}; fi`
  case-in-if-indent: gap  the arms of a `case` used as an `if` condition are not indented a level further
  empty-file: gap  a file of one empty line becomes an empty file; shfmt keeps the line
files:
  real-world: arith-spacing:3, case-in-if-indent:3, continued-conditions:2, empty-file:1, array-pipeline:1, brace-group-layout:1, expr-kept:0
unclassified: 0
