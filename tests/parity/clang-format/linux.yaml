cpp:
  format:
    empty_body_own_line: true
    indent_style: tab
    indent_size: 8
    align_with_tabs: true
    continuation_indent: 8
    access_modifier_outdent: 4
    brace_wrapping: [class, function, namespace]
    split_empty_braces: [class, function, namespace]
    short_functions: none
    align_trailing_comments: false
