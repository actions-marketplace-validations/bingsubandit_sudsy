differences:
  pointer-align: "gap  `*` of a pointer declarator the tree does not show as one (a class head, a function type `void (*f)(int *)`, the arguments of `sizeof(void *)`, a declarator after a comma): clang-format puts it next to the name or the type (PointerAlignment), Sudsy keeps the source spacing"
  reference-align: "gap  `&` and `&&` of a reference declarator, the same as pointer-align"
  binary-op-space: "gap  blanks around a binary operator (`a*b`, `x+1`, `0 ... N-1`, in a `#if` condition too): clang-format writes one blank on each side, Sudsy keeps the source"
  braced-list-padding: "gap  blanks inside braces of an initializer list (`{ 1, 2 }` against `{1, 2}`, `{ }` against `{}`; Cpp11BracedListStyle)"
  cast-space: "gap  blank after a C cast (`(T) x`): clang-format writes `(T)x` (SpaceAfterCStyleCast false)"
  brace-own-line-in-reference: "gap  a `{` clang-format puts on its own line (BraceWrapping of the style, also after a statement macro such as `for_each_cpu(i)`), Sudsy keeps it on the line"
  angle-space: "gap  blanks next to `<` and `>`: template brackets (`F<int>`, `template <typename...>`) and comparisons in `#if` conditions"
  break-string-literals: "gap  a string literal that clang-format splits in two at the column limit (BreakStringLiterals): the comparison reads it as the one literal, so the files of this name differ in another cause"
  comment-line-indent-or-join: "gap  a comment on its own line (or right after `{`) whose indent or place differs: clang-format aligns it with the code it belongs to, Sudsy keeps the source indent"
  empty-body-braces: "gap  an empty function body: clang-format keeps `{` and `}` on two lines when the `{` is on its own line (SplitEmptyFunction), Sudsy joins them to `{}`"
  trailing-comment-spacing: "gap  blanks before a trailing comment (SpacesBeforeTrailingComments) and the alignment of consecutive trailing comments"
  continuation-indent-of-non-wrap-line: "gap  indent of a line that is not a wrap point: a label (`put:`) clang-format indents with its block, the body after a loop macro, the items of a macro argument list"
  column-align: "gap  blanks that clang-format pads between the items of a braced list laid out in columns (`{\"LLVM\",   \"Google\"}`, tabs in tables), Sudsy writes one blank"
  angle-brackets-merged-by-reference: "gap  `> >` that clang-format writes `>>` (Standard: Latest; a token change)"
  space-before-paren: "gap  blank before `(`: `if(` and `for(`, `sizeof (`, `decltype (`, `foreach (`, macro names (SpaceBeforeParens)"
  statement-joined-by-reference: "gap  the body after a loop-macro head (`for_each_vma(vmi, vma) stmt;`): clang-format keeps it on the line, Sudsy breaks it"
  ternary-colon-space: "gap  GNU `a ?: b`: clang-format writes `?:`, Sudsy `? :`"
  brace-own-line-in-source: "gap  a `{` on its own line in the source that clang-format attaches (a member function body, `extern \"C\"`, a lambda): the construct is not one of the `brace_wrapping` words"
  comma-space: "gap  blanks around `,` in macro parameter lists and in lists inside directives"
  spacing-rare: "gap  blanks next to `[` `]`, `.`, `->`, `::`, padding inside `( )`, unary operators, `;` and `...`"
  call-after-paren-space: "gap  `(*fp) (args)` and `) (` of a call through a parenthesised name: clang-format writes `)(`"
  statement-split-by-reference: "gap  a statement or declarator part that clang-format puts on its own line (`) ;` after a macro call, attribute macros after `)`), Sudsy joins it"
  blank-before-close-brace: "gap  a blank line before a `}`: clang-format removes it (KeepEmptyLinesAtTheEndOfBlocks off), Sudsy keeps up to max_blank_lines"
  preprocessor-token-space: "gap  blanks around `#` and `##` in a macro body"
  format-off: "gap  text under `clang-format off`: clang-format keeps it as written, Sudsy formats it"
  assignment-space: "gap  blanks around `=` and compound assignments the parse does not see as an Assignment (designated initializers `.f=1`, default arguments)"
  string-macro-space: "gap  blank between a string literal and a macro name after it in C (`\"a\"B`, `\"%\"PRIx64`): clang-format writes one blank, Sudsy keeps the source"
  blank-lines-other: "gap  other blank-line cases: after `{` of a block, before an access specifier (EmptyLineBeforeAccessModifier)"
  sort-using-declarations: "gap  `using` declarations that clang-format sorts (SortUsingDeclarations; a reorder of tokens)"
  token-change: "gap  a token that differs between the outputs: a string literal clang-format splits where the comparison cannot join it, or a comment with trailing blanks (the tool's own artifacts; no token of Sudsy is changed or lost)"
  escaped-newline-align: "gap  the `\\` of a multi-line macro: the column it is padded to and the lines of the body clang-format re-wraps (AlignEscapedNewlines, ReflowComments off); Sudsy pads at line_width and keeps the lines"
