differences:
  cond-parens: gap  an assignment in the one pair of parentheses of a ternary test is not reported; ESLint's except-parens mode wants a second pair there
  constant-comparison-scope: gap  `no-constant-comparison` reports two literals compared anywhere; ESLint reports them only as a condition (`no-constant-condition`) and its `no-constant-binary-expression` reports other always-same results (`typeof a === undefined`)
  switch-block: gap  `no-empty-block` does not see the empty body of a `switch`
  regex-location: gap  a regex finding points at the whole literal or `new RegExp(...)`; ESLint points at the string argument (`no-control-regex`) or at the character class (`no-misleading-character-class`)
  self-assign-destructuring: gap  `[a, b] = [a, b]` and `({ a } = { a })` are reported once on the right side; ESLint reports each element that is assigned to itself
  self-assign-bracket-key: gap  `a["b"] = a.b` is not a self assignment for Sudsy (the tokens differ); ESLint compares a string key with the member name
  else-return-chain: "gap  an `else` that ends a chain of `else if` branches after a nested `if`/`else` that returns in every branch is reported; ESLint (`allowElseIf: true`) does not (three.js OperatorNode.js 344)"
  empty-catch-position: gap  an empty `catch` is reported at the `catch` clause; ESLint `no-empty` reports its block (PSScriptAnalyzer and Checkstyle report the clause, so the position is not changed)
