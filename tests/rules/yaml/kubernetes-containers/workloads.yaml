apiVersion: apps/v1
kind: Deployment
#     ^^^^^^^^^^ kubernetes-latest-tag
#     ^^^^^^^^^^ kubernetes-no-read-only-root-fs
#     ^^^^^^^^^^ kubernetes-run-as-non-root
#     ^^^^^^^^^^ kubernetes-unset-cpu-requirements
#     ^^^^^^^^^^ kubernetes-unset-memory-requirements
spec:
  template:
    spec:
      containers:
        - name: web
          image: nginx
---
apiVersion: apps/v1
kind: StatefulSet
#     ^^^^^^^^^^^ kubernetes-no-read-only-root-fs
#     ^^^^^^^^^^^ kubernetes-unset-cpu-requirements
#     ^^^^^^^^^^^ kubernetes-unset-memory-requirements
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: db
          image: "registry:5000/db:1.2"
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
        - name: sidecar
          image: db@sha256:0123
          securityContext: {readOnlyRootFilesystem: true}
          resources: {limits: {memory: 1Gi}, requests: {cpu: 1}}
---
apiVersion: batch/v1
kind: CronJob
#     ^^^^^^^ kubernetes-latest-tag
#     ^^^^^^^ kubernetes-no-read-only-root-fs
#     ^^^^^^^ kubernetes-run-as-non-root
#     ^^^^^^^ kubernetes-unset-cpu-requirements
#     ^^^^^^^ kubernetes-unset-memory-requirements
spec:
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
            - {name: init, image: "busybox:latest", securityContext: {runAsUser: 1000}}
---
apiVersion: v1
kind: Pod
#     ^^^ kubernetes-latest-tag
#     ^^^ kubernetes-no-read-only-root-fs
#     ^^^ kubernetes-run-as-non-root
#     ^^^ kubernetes-unset-cpu-requirements
#     ^^^ kubernetes-unset-memory-requirements
spec:
  containers:
    - name: a
      image: localhost:5000/a
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: ConfigMap
data:
  image: nginx
