on:
  pushh: {}
# ^^^^^ invalid-event
  push:
    branches: [main]
    branches-ignore: [dev]
#   ^^^^^^^^^^^^^^^ invalid-event
  pull_request:
    types: [opened, created]
#                   ^^^^^^^ invalid-event
  pull_request_review:
    types: submitted
    tags: v1
#   ^^^^ invalid-event
  schedule:
    - cron: '0 0 * *'
#           ^^^^^^^^^ invalid-event
    - cron: '0 0 * * 9'
#           ^^^^^^^^^^^ invalid-event
    - cron: '*/15 0-5 * * mon'
    - cron: '*/4 * * * *'
#           ^^^^^^^^^^^^^ invalid-event
    - cron: '0 1 * * *'
      timezone: Europe/Berlin
    - cron: '0 1 * * *'
      timezone: UTC
#               ^^^ invalid-event
  workflow_dispatch:
    inputs:
      kind:
#     ^^^^ invalid-event
        type: choice
      flag:
        type: boolean
        default: yes
#       ^^^^^^^ invalid-event
      ok:
        type: choice
        options: [a, b]
        default: a
      empty:
        options: []
  workflow_call:
    inputs:
      n:
        type: number
        default: x
#       ^^^^^^^ invalid-event
      r:
        required: true
        default: 1
#       ^^^^^^^ invalid-event
jobs: {}
